      },

      obsRevealAndGradeRow() {
        if (!this.requireAdmin()) return;
        const room = this.getActiveRoom();
        const st = room.obstacleState;
        const idx = st.selectedRowIdx;
        const rowObj = idx === 4 ? room.examSnapshot.obstacle.centerQuestion : room.examSnapshot.obstacle.rows[idx];
        if (!rowObj) return;

        this.stopServerTimer(room, false);
        st.questionStatus = "REVEALED";

        let anyCorrect = false;
        room.contestants.forEach(c => {
          const submitted = st.rowAnswersByContestant[c.id];
          if (submitted && checkAnswerMatch(submitted, rowObj.answer, rowObj.accepted)) {
            anyCorrect = true;
            this.applyScoreChange(room, c.id, 10, `VCNV: Đúng hàng ngang số ${idx + 1} (${rowObj.answer})`, `obs_row_${idx}_${c.id}`);
          }
        });

        if (idx < 4) {
          st.rowsStatus[idx] = "REVEALED";
          st.quadrantsRevealed[idx] = true;
        } else {
          st.centerRevealed = true;
        }

        this.triggerStageEffect(
          room,
          "obstacle_reveal",
          `MỞ HÀNG NGANG SỐ ${idx + 1}: "${rowObj.answer}"`,
          anyCorrect ? "Đã cộng +10 điểm cho các thí sinh trả lời đúng" : "Mở ô chữ và góc hình ảnh gợi ý"
        );
        this.persistMaster(true);
      },

      obsPressKeywordBuzzer(contestantId, keywordGuess = "") {
        const room = this.getActiveRoom();
        const st = room.obstacleState;
        const c = room.contestants.find(x => x.id === contestantId);
        if (!c || c.cnvLocked) {
          alert("Bạn đã bị khóa chuông Chướng ngại vật!");
          return false;
        }
        if (st.keywordRevealed) {
          alert("Chướng ngại vật đã được giải!");
          return false;
        }
        if (st.cnvBuzzerQueue.some(b => b.contestantId === contestantId && b.status === "PENDING")) {
          return false;
        }
        st.cnvBuzzerQueue.push({
          contestantId: c.id,
          name: c.name,
          timestamp: new Date().toTimeString().slice(0, 8),
          guess: String(keywordGuess || "").trim(),
          status: "PENDING"
        });
        if (!st.activeCnvSolverId) {
          st.activeCnvSolverId = c.id;
        }
        this.triggerStageEffect(room, "buzzer_win", `TÍN HIỆU CHUÔNG GIẢI CHƯỚNG NGẠI VẬT: ${c.name.toUpperCase()}`, "Tạm dừng mở hàng ngang để xử lý trả lời Từ khóa", c.id);
        this.persistMaster(true);
        return true;
      },

      obsResolveKeywordAttempt(contestantId, isCorrect) {
        if (!this.requireAdmin()) return;
        const room = this.getActiveRoom();
        const st = room.obstacleState;
        const c = room.contestants.find(x => x.id === contestantId);
        if (!c) return;

        const openedCount = st.rowsStatus.filter(s => s === "REVEALED").length;
        const scoreTable = [60, 50, 40, 30, 20];
        const pts = st.centerRevealed ? 10 : (scoreTable[openedCount] || 20);

        const qItem = st.cnvBuzzerQueue.find(b => b.contestantId === contestantId && b.status === "PENDING");
        if (qItem) qItem.status = isCorrect ? "CORRECT" : "WRONG";

        if (isCorrect) {
          st.keywordRevealed = true;
          st.rowsStatus = ["REVEALED", "REVEALED", "REVEALED", "REVEALED"];
          st.quadrantsRevealed = [true, true, true, true];
          st.centerRevealed = true;
          this.applyScoreChange(room, c.id, pts, `VCNV: Giải đúng Từ khóa "${room.examSnapshot.obstacle.keyword}" (+${pts}đ)`, `obs_cnv_win_${c.id}`);
          this.triggerStageEffect(room, "answer_correct", `VƯỢT CHƯỚNG NGẠI VẬT THÀNH CÔNG! +${pts} ĐIỂM — ${c.name.toUpperCase()}`, `Chướng ngại vật: ${room.examSnapshot.obstacle.keyword}`, c.id);
        } else {
          c.cnvLocked = true;
          this.triggerStageEffect(room, "answer_wrong", `${c.name.toUpperCase()} TRẢ LỜI SAI CHƯỚNG NGẠI VẬT`, "Tạm dừng quyền bấm chuông CNV của thí sinh này", c.id);
        }

        const nextPending = st.cnvBuzzerQueue.find(b => b.status === "PENDING");
        st.activeCnvSolverId = nextPending ? nextPending.contestantId : null;
        this.persistMaster(true);
      },

      getCurrentAccelerationQuestion(room) {
        return room.examSnapshot.acceleration[room.accelerationState.questionIdx] || room.examSnapshot.acceleration[0];
      },

      accStartQuestion() {
        if (!this.requireAdmin()) return;
        const room = this.getActiveRoom();
        const st = room.accelerationState;
        const q = this.getCurrentAccelerationQuestion(room);
        st.questionVisible = true;
        st.questionStatus = "ACCEPTING_ANSWERS";
        st.questionStartTimestamp = Date.now();
        st.submissions = [];
        st.scoredProcessedKey = null;
        this.startServerTimer(room, q.timeSec || 20, `${q.title}`);
        this.persistMaster(true);
      },

      accSubmitAnswer(contestantId, answerText) {
        const room = this.getActiveRoom();
        const st = room.accelerationState;
        const q = this.getCurrentAccelerationQuestion(room);
        const c = room.contestants.find(x => x.id === contestantId);
        if (!c) return false;
        if (st.questionStatus !== "ACCEPTING_ANSWERS" || room.timer.status !== "RUNNING" || Date.now() > room.timer.deadlineMs) {
          alert("Đã hết thời gian gửi đáp án Tăng tốc!");
          return false;
        }
        const elapsedSec = Math.max(0.01, Math.min(q.timeSec, (Date.now() - st.questionStartTimestamp) / 1000));
        const timeSecFormatted = Number(elapsedSec.toFixed(2));
        const existingIdx = st.submissions.findIndex(s => s.contestantId === contestantId);
        const entry = {
          contestantId: c.id,
          contestantName: c.name,
          answer: String(answerText || "").trim().toUpperCase(),
          timeSec: timeSecFormatted,
          isCorrect: null,
          pointsAwarded: 0
        };
        if (existingIdx >= 0) {
          st.submissions[existingIdx] = entry;
        } else {
          st.submissions.push(entry);
        }
        st.submissions.sort((a, b) => a.timeSec - b.timeSec);
        this.persistMaster(true);
        return true;
      },

      accLoadImage4SampleTimestamps() {
        if (!this.requireAdmin()) return;
        const room = this.getActiveRoom();
        room.accelerationState.questionIdx = 1;
        room.accelerationState.questionStatus = "REVEALED";
        room.accelerationState.submissions = [
          { contestantId: "u_c1", contestantName: "Diệu Tú (Duy Khoa)", answer: "HỒNG", timeSec: 5.09, isCorrect: false, pointsAwarded: 0 },
          { contestantId: "u_c2", contestantName: "Thành Trung (Thanh Tùng)", answer: "SÔNG HƯƠNG", timeSec: 25.39, isCorrect: false, pointsAwarded: 0 },
          { contestantId: "u_c3", contestantName: "Thiện Nhân (Bảo Khánh)", answer: "GIANH", timeSec: 36.33, isCorrect: true, pointsAwarded: 40 },
          { contestantId: "u_c4", contestantName: "Duy Hùng (Nhựt Lam)", answer: "GIANH", timeSec: 37.50, isCorrect: true, pointsAwarded: 30 }
        ];
        this.stopServerTimer(room, false);
        this.persistMaster(true);
      },

      accAutoGradeAndReveal() {
        if (!this.requireAdmin()) return;
        const room = this.getActiveRoom();
        const st = room.accelerationState;
        const q = this.getCurrentAccelerationQuestion(room);
        this.stopServerTimer(room, false);
        st.questionStatus = "REVEALED";

        st.submissions.sort((a, b) => a.timeSec - b.timeSec);
        const rankPoints = q.pointsRank || [40, 30, 20, 10];
        let currentRankIdx = 0;
        let lastTime = null;
        let lastPts = 40;

        st.submissions.forEach((sub) => {
          const matched = checkAnswerMatch(sub.answer, q.answer, q.accepted);
          sub.isCorrect = matched;
          if (matched) {
            const pts = (lastTime !== null && sub.timeSec === lastTime) ? lastPts : (rankPoints[currentRankIdx] || 10);
            sub.pointsAwarded = pts;
            lastTime = sub.timeSec;
            lastPts = pts;
            currentRankIdx += 1;
            this.applyScoreChange(room, sub.contestantId, pts, `Tăng tốc câu ${q.order}: Đúng (${sub.timeSec.toFixed(2)}s -> +${pts}đ)`, `acc_${q.id}_${sub.contestantId}`);
          } else {
            sub.pointsAwarded = 0;
          }
        });

        this.triggerStageEffect(room, "answer_correct", `CÔNG BỐ KẾT QUẢ TĂNG TỐC CÂU ${q.order}`, `Đáp án chuẩn: ${q.answer}`);
        this.persistMaster(true);
      },

      getCurrentFinishQuestion(room) {
        const st = room.finishState;
        const qId = st.assignedQuestionIds[st.currentQuestionSlot];
        const found = room.examSnapshot.finishQuestions.find(q => q.id === qId);
        if (found) return found;
        const pts = st.selectedPackage[st.currentQuestionSlot] || 20;
        return room.examSnapshot.finishQuestions.find(q => q.points === pts) || room.examSnapshot.finishQuestions[0];
      },

      finConfigurePackage(contestantIdx, pkgArray) {
        if (!this.requireAdmin()) return;
        const room = this.getActiveRoom();
        const st = room.finishState;
        st.activeContestantIdx = contestantIdx;
        st.selectedPackage = pkgArray.map(Number);
        st.currentQuestionSlot = 0;
        st.starOfHopeUsedInTurn = false;
        st.starOfHopeActiveOnCurrent = false;
        st.questionVisible = false;
        st.questionStatus = "HIDDEN";
        st.stealBuzzerState = "CLOSED";
        st.stealWinnerId = null;

        const usedIds = [];
        st.assignedQuestionIds = st.selectedPackage.map(pts => {
          const candidate = room.examSnapshot.finishQuestions.find(q => q.points === pts && !usedIds.includes(q.id));
          if (candidate) {
            usedIds.push(candidate.id);
            return candidate.id;
          }
          return room.examSnapshot.finishQuestions[0].id;
        });
        this.stopServerTimer(room, false);
        this.persistMaster(true);
      },

      finToggleStarOfHope() {
        const room = this.getActiveRoom();
        const st = room.finishState;
        const activeC = room.contestants[st.activeContestantIdx];
        const isAllowed = (this.session?.role === "ADMIN") || (this.session?.role === "CONTESTANT" && this.session?.userId === activeC.id);
        if (!isAllowed) {
          alert("Chỉ Quản trị viên hoặc Thí sinh đang trong lượt Về đích mới được đặt Ngôi sao hy vọng!");
          return;
        }
        if (st.questionStatus !== "PUBLISHED") {
          alert("Ngôi sao hy vọng phải được đặt TRƯỚC KHI bắt đầu đếm giờ câu hỏi!");
          return;
        }
        if (!st.starOfHopeActiveOnCurrent && st.starOfHopeUsedInTurn) {
          alert("Thí sinh này đã sử dụng Ngôi sao hy vọng trong lượt Về đích rồi (mỗi lượt chỉ được dùng 1 lần)!");
          return;
        }
        st.starOfHopeActiveOnCurrent = !st.starOfHopeActiveOnCurrent;
        if (st.starOfHopeActiveOnCurrent) {
          this.broadcastAudio("star_of_hope");
          this.logAudit(this.session.username, this.session.role, "STAR_OF_HOPE", `${activeC.name} đặt Ngôi sao hy vọng ở câu số ${st.currentQuestionSlot + 1}`, room);
        }
        this.persistMaster(true);
      },

      finStartMainTimer() {
        if (!this.requireAdmin()) return;
        const room = this.getActiveRoom();
        const st = room.finishState;
        const q = this.getCurrentFinishQuestion(room);
        if (st.starOfHopeActiveOnCurrent) {
          st.starOfHopeUsedInTurn = true;
        }
        st.questionVisible = true;
        st.questionStatus = "ACCEPTING_ANSWERS";
        st.primaryAnswer = "";
        st.stealAnswer = "";
        st.mainAnswerGraded = false;
        st.stealAnswerGraded = false;
        st.stealBuzzerState = "CLOSED";
        st.stealWinnerId = null;
        this.startServerTimer(room, q.timeSec || (q.points === 30 ? 20 : 15), `Về đích - Câu ${st.currentQuestionSlot + 1}/3 (${q.points} điểm)`);
        this.persistMaster(true);
      },

      finSubmitAnswer(contestantId, answerText) {
        const room = this.getActiveRoom();
        const st = room.finishState;
        const activeC = room.contestants[st.activeContestantIdx];
        const cleaned = String(answerText || "").trim();
        if (!cleaned) return false;

        if (activeC && activeC.id === contestantId) {
          st.primaryAnswer = cleaned;
          st.mainAnswerGraded = false;
          if (st.questionStatus === "ACCEPTING_ANSWERS") {
            st.questionStatus = "LOCKED";
            this.stopServerTimer(room, false);
          }
          this.persistMaster(true);
          return true;
        } else if (st.stealWinnerId === contestantId) {
          st.stealAnswer = cleaned;
          st.stealAnswerGraded = false;
          this.persistMaster(true);
          return true;
        } else {
          alert("Bạn hiện chưa có quyền gửi đáp án ở lượt Về đích này!");
          return false;
        }
      },

      finGradeMainContestant(isCorrect) {
        if (!this.requireAdmin()) return;
        const room = this.getActiveRoom();
        const st = room.finishState;
        const activeC = room.contestants[st.activeContestantIdx];
        const q = this.getCurrentFinishQuestion(room);
        const pts = st.selectedPackage[st.currentQuestionSlot] || q.points || 20;
        const actionKey = `fin_main_${st.activeContestantIdx}_${st.currentQuestionSlot}`;
        st.mainAnswerGraded = true;

        this.stopServerTimer(room, false);

        if (isCorrect) {
          const earned = st.starOfHopeActiveOnCurrent ? pts * 2 : pts;
          st.questionStatus = "REVEALED";
          st.stealBuzzerState = "CLOSED";
          this.applyScoreChange(room, activeC.id, earned, `Về đích: Đúng câu ${pts}đ ${st.starOfHopeActiveOnCurrent ? '(Ngôi sao hy vọng x2)' : ''}`, actionKey);
          this.triggerStageEffect(room, "answer_correct", `CHÍNH XÁC! +${earned} ĐIỂM CHO ${activeC.name.toUpperCase()}`, `Đáp án chuẩn: ${q.answer}`, activeC.id);
        } else {
          if (st.starOfHopeActiveOnCurrent) {
            this.applyScoreChange(room, activeC.id, -pts, `Về đích: Sai câu ${pts}đ có Ngôi sao hy vọng (-${pts}đ)`, actionKey);
          }
          st.questionStatus = "STEAL_WINDOW";
          st.stealBuzzerState = "OPEN";
          st.stealWinnerId = null;
          const stealSec = room.examSnapshot.roundsConfig?.finish?.stealWindowSec || 5;
          this.startServerTimer(room, stealSec, `Mở chuông ${stealSec}s giành quyền trả lời (${pts} điểm)`);
          this.triggerStageEffect(room, "answer_wrong", `${activeC.name.toUpperCase()} CHƯA CHÍNH XÁC — MỞ CHUÔNG 5 GIÂY CHO 3 THÍ SINH CÒN LẠI!`, "Bấm chuông nhanh nhất để giành quyền trả lời");
        }
        this.persistMaster(true);
      },

      finPressStealBuzzer(contestantId) {
        const room = this.getActiveRoom();
        const st = room.finishState;
        const activeC = room.contestants[st.activeContestantIdx];
        if (activeC && activeC.id === contestantId) {
          alert("Thí sinh đang trong lượt thi chính không được bấm chuông cướp điểm của chính mình!");
          return false;
        }
        if (st.questionStatus !== "STEAL_WINDOW" || st.stealBuzzerState !== "OPEN") {
          alert("Chuông giành quyền Về đích hiện chưa mở hoặc đã có người giành được!");
          return false;
        }
        const stealer = room.contestants.find(x => x.id === contestantId);
        if (!stealer) return false;

        st.stealBuzzerState = "WON";
        st.stealWinnerId = stealer.id;
        this.stopServerTimer(room, false);
        this.triggerStageEffect(room, "buzzer_win", `${stealer.name.toUpperCase()} GIÀNH QUYỀN TRẢ LỜI VỀ ĐÍCH!`, "Đã khóa chuông đối với các thí sinh khác", stealer.id);
        this.persistMaster(true);
        return true;
      },

      finGradeStealContestant(isCorrect) {
        if (!this.requireAdmin()) return;
        const room = this.getActiveRoom();
        const st = room.finishState;
        const activeC = room.contestants[st.activeContestantIdx];
        const stealer = room.contestants.find(x => x.id === st.stealWinnerId);
        if (!stealer) return;

        const q = this.getCurrentFinishQuestion(room);
        const pts = st.selectedPackage[st.currentQuestionSlot] || q.points || 20;
        const actionKey = `fin_steal_${st.activeContestantIdx}_${st.currentQuestionSlot}_${stealer.id}`;
        st.stealAnswerGraded = true;

        st.questionStatus = "REVEALED";
        st.stealBuzzerState = "LOCKED";

        if (isCorrect) {
          this.applyScoreChange(room, stealer.id, pts, `Về đích: Giành quyền trả lời đúng câu ${pts}đ`, actionKey + "_win");
          if (!st.starOfHopeActiveOnCurrent) {
            this.applyScoreChange(room, activeC.id, -pts, `Về đích: Bị ${stealer.name} giành điểm câu ${pts}đ`, actionKey + "_loss");
          }
          this.triggerStageEffect(room, "answer_correct", `${stealer.name.toUpperCase()} TRẢ LỜI ĐÚNG (+${pts} ĐIỂM)!`, `Đáp án chuẩn: ${q.answer}`, stealer.id);
        } else {
          const halfPenalty = -(pts / 2);
          this.applyScoreChange(room, stealer.id, halfPenalty, `Về đích: Giành quyền nhưng trả lời sai (${halfPenalty}đ)`, actionKey + "_pen");
          this.triggerStageEffect(room, "answer_wrong", `${stealer.name.toUpperCase()} TRẢ LỜI SAI (${halfPenalty} ĐIỂM)`, `Đáp án chuẩn: ${q.answer}`, stealer.id);
        }
        this.persistMaster(true);
      },

      finNextSlot() {
        if (!this.requireAdmin()) return;
        const room = this.getActiveRoom();
        const st = room.finishState;
        if (st.currentQuestionSlot < 2) {
          st.currentQuestionSlot += 1;
          st.starOfHopeActiveOnCurrent = false;
          st.questionVisible = false;
          st.questionStatus = "HIDDEN";
          st.stealBuzzerState = "CLOSED";
          st.stealWinnerId = null;
          st.primaryAnswer = "";
          st.stealAnswer = "";
          st.mainAnswerGraded = false;
          st.stealAnswerGraded = false;
          this.stopServerTimer(room, false);
          this.persistMaster(true);
        } else {
          alert(`Thí sinh ${room.contestants[st.activeContestantIdx].name} đã hoàn thành gói 3 câu hỏi Về đích! Hãy chọn thí sinh tiếp theo hoặc Công bố Chung cuộc.`);
        }
      },

      validateExamSet(exam) {
        const errors = [];
        if (!exam.title || !exam.code) errors.push("Thiếu tên đề hoặc mã đề.");
        if (!Array.isArray(exam.kickoffPrivate) || exam.kickoffPrivate.length !== 24) {
          errors.push(`Khởi động riêng phải có đúng 24 câu (hiện có ${exam.kickoffPrivate?.length || 0} câu).`);
        } else {
          for (let c = 0; c < 4; c++) {
            const cCount = exam.kickoffPrivate.filter(q => q.contestantIndex === c).length;
            if (cCount !== 6) errors.push(`Thí sinh ${c + 1} trong Khởi động riêng phải có đúng 6 câu (hiện có ${cCount}).`);
          }
        }
        if (!Array.isArray(exam.kickoffCommon) || exam.kickoffCommon.length < 4) {
          errors.push("Khởi động chung cần tối thiểu 4 câu hỏi.");
        }
        if (!exam.obstacle || !exam.obstacle.keyword || !Array.isArray(exam.obstacle.rows) || exam.obstacle.rows.length !== 4) {
          errors.push("Vượt chướng ngại vật thiếu Từ khóa hoặc không đủ 4 hàng ngang.");
        }
        if (!Array.isArray(exam.acceleration) || exam.acceleration.length !== 4) {
          errors.push("Tăng tốc phải có đủ 4 câu hỏi.");
        }
        if (!Array.isArray(exam.finishQuestions) || exam.finishQuestions.length < 6) {
          errors.push("Ngân hàng Về đích phải có tối thiểu 6 câu hỏi (đủ các mức 20 và 30 điểm).");
        }
        const allQs = [
          ...(exam.kickoffPrivate || []),
          ...(exam.kickoffCommon || []),
          ...(exam.acceleration || []),
          ...(exam.finishQuestions || [])
        ];
        allQs.forEach((q, idx) => {
          if (!q.text || !String(q.text).trim()) errors.push(`Câu hỏi #${idx + 1} (${q.id}) bị trống nội dung.`);
          if (!q.answer || !String(q.answer).trim()) errors.push(`Câu hỏi #${idx + 1} (${q.id}) bị thiếu đáp án chuẩn.`);
          if (Number(q.timeSec) <= 0) errors.push(`Câu hỏi #${idx + 1} (${q.id}) có thời gian không hợp lệ.`);
        });
        return {
          valid: errors.length === 0,
          errors
        };
      },

      cloneExam(sourceExamId) {
        if (!this.requireAdmin()) return;
        const src = this.master.exams.find(e => e.id === sourceExamId);
        if (!src) return;
        const copy = JSON.parse(JSON.stringify(src));
        const suffix = Math.floor(100 + Math.random() * 900);
        copy.id = "exam_clone_" + Date.now();
        copy.code = `${src.code}-COPY-${suffix}`;
        copy.title = `${src.title} (Bản sao #${suffix})`;
        copy.status = "DRAFT";
        copy.version = 1;
        copy.lastUsedAt = "Chưa sử dụng";
        copy.versionHistory = [
          { version: 1, editor: this.session.username, time: "2026-10-14 15:15", summary: `Nhân bản độc lập từ đề ${src.code}` }
        ];
        this.master.exams.push(copy);
        this.examFilter.editingExamId = copy.id;
        this.logAudit(this.session.username, "ADMIN", "EXAM_CLONED", `Nhân bản đề ${src.code} thành ${copy.code}`);
        this.persistMaster(true);
      },

      runAutomatedVerificationSuite() {
        const results = [];

        };

        const adminUser = this.master.users.find(u => u.username === "admin");

        const roomA = this.master.rooms[0];

          roomA.examSnapshot && roomA.examSnapshot !== ex1,
          "Thay đổi đề gốc không làm sai lệch lịch sử cuộc thi đang chạy");

        const kpCounts = [0, 1, 2, 3].map(idx => ex1.kickoffPrivate.filter(q => q.contestantIndex === idx).length);
        addTest("28.3 Khởi động riêng", "Cấu trúc 4 thí sinh × 6 câu = 24 câu riêng biệt, không luân phiên từng câu",
          ex1.kickoffPrivate.length === 24 && kpCounts.every(c => c === 6),
          `Số câu theo thí sinh: [${kpCounts.join(", ")}] = 24 câu`);
        addTest("28.3 Khởi động riêng", "Cấu hình mặc định: Đồng hồ 3 giây, Đúng +10, Sai 0, Hết giờ 0",
          ex1.roundsConfig.kickoffPrivate.timeSec === 3 &&
          ex1.roundsConfig.kickoffPrivate.correctPts === 10 &&
          ex1.roundsConfig.kickoffPrivate.wrongPts === 0,
          "Time=3s, Correct=+10, Wrong=0, Timeout=0");

        addTest("28.4 Khởi động chung", "Tách biệt hoàn toàn dữ liệu & trạng thái với Khởi động riêng",
          Array.isArray(ex1.kickoffCommon) && ex1.kickoffCommon.length === 12 && Boolean(roomA.kickoffCommonState),
          `Bộ câu hỏi chung: ${ex1.kickoffCommon.length} câu, Mode=${roomA.kickoffCommonState.mode}`);

        addTest("28.5 Vượt chướng ngại vật", "Đủ 4 hàng ngang gợi ý (XUÂN, 2025, BẮC NINH, QUẢNG NINH) + Ô trung tâm + Từ khóa",
          ex1.obstacle.rows.length === 4 && ex1.obstacle.rows[0].answer === "XUÂN" && ex1.obstacle.rows[3].answer === "QUẢNG NINH",
          `Từ khóa: ${ex1.obstacle.keyword} (${ex1.obstacle.keywordDisplayCount})`);

        addTest("28.6 Tăng tốc", "Đủ 4 câu hỏi (10s, 20s, 30s, 40s) và xếp hạng thời gian chính xác đến 0.01s",
          ex1.acceleration.length === 4 &&
          ex1.acceleration.map(q => q.timeSec).join(",") === "10,20,30,40",
          "Mốc thời gian: 10s, 20s, 30s, 40s; Điểm: 40/30/20/10");

        addTest("28.7 Về đích", "Hỗ trợ chọn gói 3 câu (20/30 điểm), Ngôi sao hy vọng x2 và chuông cướp điểm 5s",
          roomA.finishState.selectedPackage.length === 3 && ex1.roundsConfig.finish.stealWindowSec === 5,
          `Gói hiện tại: ${roomA.finishState.selectedPackage.join("/")}, Chuông cướp điểm: 5s`);

        const topPinnedSelect = document.querySelector(".top-utility-bar select[data-effect-selector]");
        addTest("28.8 Hệ thống Hiệu ứng", "Bộ chọn hiệu ứng KHÔNG bị ghim ở đầu trang chủ hoặc thanh tiêu đề",
          topPinnedSelect === null,
          "Zero effect selector widgets pinned in header/home");
        addTest("28.8 Hệ thống Hiệu ứng", "Đầy đủ danh mục hiệu ứng gắn đúng vùng mục tiêu (targetZone)",
          Object.keys(this.master.effectsConfig).length >= 9,
          `${Object.keys(this.master.effectsConfig).length} nhóm sự kiện sân khấu có cấu hình & Preview độc lập`);

        addTest("28.9 Đồng bộ Realtime & Đa phòng", "Cô lập dữ liệu giữa Phòng A (OLP-2026-A) và Phòng B (OLP-2026-B)",
          this.master.rooms.length >= 2 && this.master.rooms[0].id !== this.master.rooms[1].id,
          `Đang quản lý ${this.master.rooms.length} phòng thi độc lập`);

        const normCheck = checkAnswerMatch("  nguyễn   đình thi ", "Nguyễn Đình Thi", ["Nguyen Dinh Thi"]);
        addTest("28.10 Bảo mật & Chuẩn hóa đáp án", "Chuẩn hóa khoảng trắng và chữ hoa/thường chính xác, giữ nguyên dấu tiếng Việt",
          normCheck === true && !checkAnswerMatch("Sai dap an", "Nguyễn Đình Thi"),
          "Hàm checkAnswerMatch() hoạt động chính xác");

        this.testReport = {
          ranAt: new Date().toTimeString().slice(0, 8),
          total: results.length,
          passed: results.filter(r => r.passed).length,
          results
        };
        this.persistMaster(false);
      }
    };

    Object.assign(AppRuntime, {

      autoPlayTimer: null,
      autoPlayStep: 0,

      toggleAutoPlayMatch() {
        if (this.autoPlayTimer) {
          clearInterval(this.autoPlayTimer);
          this.autoPlayTimer = null;
          this.render();
          return;
        }
        // Ensure logged in as ADMIN so user sees the full stage + controls in action
        if (!this.session) {
          const adminUser = this.master.users.find(u => u.role === "ADMIN");
          this.createSession(adminUser, "OLP-2026-A", false);
        }
        this.adminTab = "LIVE_CONTROL";
        this.autoPlayStep = 0;
        const steps = [
          () => {

            room.projectionScene = "ROUND_STAGE";
            this.switchRound("KICKOFF_PRIVATE");
            this.kpStartTimer3s();
          },
          () => {

            this.kpSubmitAnswer("u_c1", "Nguyễn Đình Thi");
            this.kpGrade(true);
          },
          () => {
            this.switchRound("KICKOFF_COMMON");
            this.kcOpenQuestionAndBuzzer();
          },
          () => {
            this.kcPressBuzzer("u_c3");
          },
          () => {
            this.kcGradeBuzzerWinner(true);
          },
          () => {
            this.switchRound("OBSTACLE");
            this.obsSelectRow(2);
            this.obsRevealAndGradeRow();
          },
          () => {

            room.projectionScene = "WINNER_CEREMONY";
            this.triggerStageEffect(room, "winner_reveal", "VINH DANH QUÁN QUÂN VÒNG NGUYỆT QUẾ OLYMPIA ARENA");
            this.persistMaster(true);
            clearInterval(this.autoPlayTimer);
            this.autoPlayTimer = null;
            this.render();
          }
        ];

        steps[0]();
        this.autoPlayStep = 1;
        this.autoPlayTimer = setInterval(() => {
          if (this.autoPlayStep < steps.length) {
            steps[this.autoPlayStep]();
            this.autoPlayStep += 1;

            clearInterval(this.autoPlayTimer);
            this.autoPlayTimer = null;
            this.render();

          ${(!videoUrl && imageUrl) ? `
            <div style="margin-top:12px;max-width:440px;border:1.5px solid #38bdf8;border-radius:6px;overflow:hidden;">
              <img src="${imageUrl}" alt="Hình minh họa câu hỏi" style="width:100%;max-height:210px;object-fit:cover;display:block;" />
            </div>
          ` : ""}
        `;
      },

      adminStartOrToggleTimer() {
        const room = this.getActiveRoom();
        if (!room) return;
        if (room.timer.status === "RUNNING") {
          this.pauseServerTimer(room);
        } else if (room.timer.status === "PAUSED") {
          this.resumeServerTimer(room);
        } else {
          if (room.currentRound === "KICKOFF_PRIVATE") this.kpStartTimer3s();
          else if (room.currentRound === "KICKOFF_COMMON") this.kcOpenQuestionAndBuzzer();
          else if (room.currentRound === "OBSTACLE") this.obsStartRowTimer15s();
          else if (room.currentRound === "ACCELERATION") this.accStartQuestion();
          else if (room.currentRound === "FINISH") this.finStartMainTimer();
        }
      },

      adminRevealCurrentAnswer() {
        if (!this.requireAdmin()) return;
        const room = this.getActiveRoom();
        if (room.currentRound === "KICKOFF_PRIVATE") {
          room.kickoffPrivateState.questionStatus = "REVEALED";
        } else if (room.currentRound === "KICKOFF_COMMON") {
          room.kickoffCommonState.questionStatus = "REVEALED";
        } else if (room.currentRound === "OBSTACLE") {
          this.obsRevealAndGradeRow();
          return;
        } else if (room.currentRound === "ACCELERATION") {
          this.accAutoGradeAndReveal();
          return;
        } else if (room.currentRound === "FINISH") {
          room.finishState.questionStatus = "REVEALED";
        }
        this.stopServerTimer(room, false);
        this.persistMaster(true);
      },

      adminNextQuestionSafe() {
        if (!this.requireAdmin()) return;
        const room = this.getActiveRoom();
        if (room.currentRound === "KICKOFF_PRIVATE") this.kpNextQuestion();
        else if (room.currentRound === "KICKOFF_COMMON") this.kcNextQuestion();
        else if (room.currentRound === "ACCELERATION") {
          room.accelerationState.questionIdx = (room.accelerationState.questionIdx + 1) % room.examSnapshot.acceleration.length;
          room.accelerationState.questionVisible = false;
          room.accelerationState.questionStatus = "HIDDEN";
          room.accelerationState.submissions = [];
          this.stopServerTimer(room, false);
          this.persistMaster(true);
        } else if (room.currentRound === "FINISH") {
          this.finNextSlot();
        }
      },

      switchRound(newRound) {
        if (!this.requireAdmin()) return;
        const room = this.getActiveRoom();
        room.currentRound = newRound;
        room.projectionScene = "ROUND_STAGE";
        if (newRound === "KICKOFF_PRIVATE") { room.kickoffPrivateState.questionVisible = false; room.kickoffPrivateState.questionStatus = "HIDDEN"; }
        else if (newRound === "KICKOFF_COMMON") { room.kickoffCommonState.questionVisible = false; room.kickoffCommonState.questionStatus = "HIDDEN"; }
        else if (newRound === "OBSTACLE") { room.obstacleState.questionVisible = false; room.obstacleState.questionStatus = "HIDDEN"; }
        else if (newRound === "ACCELERATION") { room.accelerationState.questionVisible = false; room.accelerationState.questionStatus = "HIDDEN"; }
        else if (newRound === "FINISH") { room.finishState.questionVisible = false; room.finishState.questionStatus = "HIDDEN"; }
        this.stopServerTimer(room, false);
        const roundNames = {
          KICKOFF_PRIVATE: "VÒNG 1A: KHỞI ĐỘNG RIÊNG (24 CÂU - 6 CÂU/THÍ SINH)",
          KICKOFF_COMMON: "VÒNG 1B: KHỞI ĐỘNG CHUNG (CHUÔNG GIÀNH QUYỀN)",
          OBSTACLE: "VÒNG 2: VƯỢT CHƯỚNG NGẠI VẬT",
          ACCELERATION: "VÒNG 3: TĂNG TỐC",
          FINISH: "VÒNG 4: VỀ ĐÍCH"
        };
        this.triggerStageEffect(room, "round_transition", `CHUYỂN SANG ${roundNames[newRound] || newRound}`, `Phòng thi: ${room.code}`);
        this.logAudit(this.session.username, "ADMIN", "ROUND_CHANGED", `Chuyển sang vòng ${newRound}`, room);
        this.persistMaster(true);
      },

      openNewDeviceTab(role, seat = 1) {
        const room = this.getActiveRoom();
        const url = new URL(window.location.href);
        url.searchParams.set("quickRole", role);
        url.searchParams.set("seat", String(seat));
        url.searchParams.set("room", room.code);
        window.open(url.toString(), "_blank");
      },

      renderVtvBroadcastStage(room, viewerMode = "VIEWER") {
        const canSeeSecret = (viewerMode === "ADMIN");
        let configuredSec = 3;
        if (room.currentRound === "KICKOFF_PRIVATE") configuredSec = this.getCurrentKickoffPrivateQuestion(room)?.timeSec || room.examSnapshot.roundsConfig.kickoffPrivate.timeSec || 3;
        else if (room.currentRound === "KICKOFF_COMMON") configuredSec = this.getCurrentKickoffCommonQuestion(room)?.timeSec || room.examSnapshot.roundsConfig.kickoffCommon.timeSec || 5;
        else if (room.currentRound === "OBSTACLE") configuredSec = room.examSnapshot.obstacle.timePerRowSec || 15;
        else if (room.currentRound === "ACCELERATION") configuredSec = this.getCurrentAccelerationQuestion(room)?.timeSec || 20;
        else if (room.currentRound === "FINISH") {
          const fq = this.getCurrentFinishQuestion(room);
          configuredSec = room.finishState.questionStatus === "STEAL_WINDOW"
            ? (room.examSnapshot.roundsConfig?.finish?.stealWindowSec || 5)
            : (fq?.timeSec || (fq?.points === 30 ? 20 : 15));
        }
        const remMs = room.timer.status === "IDLE" ? (configuredSec * 1000) : this.getTimerRemainingMs(room);
        const timerSecStr = (remMs / 1000).toFixed(1) + "s";
        const isUrgent = room.timer.status === "RUNNING" && remMs <= 3000;

        if (room.projectionScene === "WAITING_LOBBY") {
          return `
            <div class="vtv-stage-wrapper" style="text-align:center; padding:48px 24px;">
              <div class="vtv-stage-inner">
                <div class="laurel-emblem" style="width:68px;height:68px;font-size:28px;margin:0 auto 16px;">♛</div>
                <div style="font-size:13px;color:#67e8f9;font-weight:800;letter-spacing:2px;text-transform:uppercase;">ĐƯỜNG LÊN ĐỈNH OLYMPIA — HỆ THỐNG THI ĐẤU KIẾN THỨC</div>
                <h2 style="font-size:32px;font-weight:900;margin:10px 0;color:#fff;">${escapeHtml(room.name)}</h2>
                <p style="color:#cbd5e1;font-size:15px;margin-bottom:24px;">Mã phòng: <strong style="color:#fbbf24;">${escapeHtml(room.code)}</strong> • Đề thi: <strong>${escapeHtml(room.examCode)}</strong></p>
                <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;max-width:860px;margin:0 auto;">
                  ${room.contestants.map(c => `
                    <div style="background:rgba(12,42,92,0.85);border:1.5px solid #38bdf8;border-radius:8px;padding:14px;">
                      <div style="font-size:11px;color:#67e8f9;font-weight:800;">VỊ TRÍ SỐ ${c.seat}</div>
                      <div style="font-size:18px;font-weight:900;color:#fff;margin:4px 0;">${escapeHtml(c.name)}</div>
                      <div style="font-size:12px;color:#94a3b8;">${escapeHtml(c.school)}</div>
                    </div>
                  `).join("")}
                </div>
              </div>
            </div>
          `;
        }

        if (room.projectionScene === "LEADERBOARD_SCENE" || room.projectionScene === "WINNER_CEREMONY") {
          const sorted = [...room.contestants].sort((a, b) => b.score - a.score);
          const champion = sorted[0];
          return `
            <div class="vtv-stage-wrapper" style="padding:32px 26px;">
              <div class="vtv-stage-inner">
                <div style="text-align:center;margin-bottom:22px;">
                  <span class="star-of-hope-badge" style="font-size:13px;padding:6px 16px;">
                    ${room.projectionScene === "WINNER_CEREMONY" ? "♛ LỄ TRAO VÒNG NGUYỆT QUẾ VINH QUANG" : "BẢNG XẾP HẠNG ĐIỂM SỐ HIỆN TẠI"}
                  </span>
                  <h2 style="font-size:28px;font-weight:900;color:#fff;margin-top:10px;">
                    ${room.projectionScene === "WINNER_CEREMONY" ? `QUÁN QUÂN: ${escapeHtml(champion.name.toUpperCase())} (${champion.score} ĐIỂM)` : escapeHtml(room.name)}
                  </h2>
                </div>
                <div style="display:flex;flex-direction:column;gap:10px;max-width:760px;margin:0 auto;">
                  ${sorted.map((c, idx) => `
                    <div class="vtv-score-row ${idx === 0 ? 'active-turn' : 'common-mode'}" style="padding:14px 22px;font-size:18px;">
                      <div>
                        <span style="color:#fde047;margin-right:10px;">HẠNG ${idx + 1}</span>
                        <span class="c-name">${escapeHtml(c.name)}</span>
                        <span style="font-size:12px;color:#cbd5e1;margin-left:10px;font-weight:500;">(${escapeHtml(c.school)})</span>
                      </div>
                      <div class="c-points" style="font-size:26px;">${c.score}</div>
                    </div>
                  `).join("")}
                </div>

                <!-- Post-Match Play Again / Replay Control Box -->
                <div style="max-width:760px;margin:24px auto 0;background:rgba(4,15,35,0.9);border:2px solid #00d4ff;border-radius:10px;padding:18px 20px;text-align:left;box-shadow:0 8px 25px rgba(0,0,0,0.6);">
                  <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:12px;">
                    <div>
                      <div style="font-size:12px;font-weight:800;color:#fde047;text-transform:uppercase;letter-spacing:0.6px;">
                        🔄 TÙY CHỌN THI LẠI SAU KHI KẾT THÚC CUỘC THI
                      </div>
                      <div style="font-size:12.5px;color:#cbd5e1;margin-top:2px;">
                        Kết quả lượt thi này sẽ được lưu tự động vào Lịch sử trước khi bắt đầu lượt thi mới.
                      </div>
                    </div>
                    <span class="pill live">Sẵn sàng lượt mới</span>
                  </div>

                  <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;">
                    <button class="btn btn-emerald btn-lg" onclick="AppRuntime.restartCompetitionMatch(null, false)">
                      🔄 Thi Lại Từ Đầu (Đề Hiện Tại: ${escapeHtml(room.examCode)})
                    </button>
                    <button class="btn btn-gold" onclick="AppRuntime.restartCurrentRoundOnly(false)">
                      🔁 Thi Lại Riêng Vòng Vừa Chơi (${escapeHtml(room.currentRound)})
                    </button>
                    <div style="display:flex;align-items:center;gap:6px;margin-left:auto;">
                      <select id="replay-exam-select" class="form-select" style="width:auto;padding:8px 10px;">
                        ${this.master.exams.map(ex => `
                          <option value="${ex.id}" ${ex.id === room.examId ? 'selected' : ''}>
                            Đề: ${escapeHtml(ex.code)} — ${escapeHtml(ex.title.slice(0, 32))}...
                          </option>
                        `).join("")}
                      </select>
                      <button class="btn btn-primary" onclick="AppRuntime.restartCompetitionMatch(document.getElementById('replay-exam-select').value, false)">
                        🚀 Đổi Đề & Thi Lại
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          `;
        }

        const eff = room.activeEffectEvent;
        let effectBannerHtml = "";
        if (eff && (Date.now() - eff.timestamp < 120000)) {
          let cls = "effect-info";
          if (eff.type === "answer_correct" || eff.type === "score_add") cls = "effect-correct";
          else if (eff.type === "answer_wrong" || eff.type === "score_deduct") cls = "effect-wrong";
          else if (eff.type === "buzzer_win") cls = "effect-buzzer";
          effectBannerHtml = `
            <div class="stage-effect-banner ${cls}">
              <div>
                <strong>✦ ${escapeHtml(eff.title)}</strong>
                ${eff.subtitle ? `<span style="margin-left:10px;font-weight:600;opacity:0.92;font-size:13px;">— ${escapeHtml(eff.subtitle)}</span>` : ""}
              </div>
              <span style="font-size:11px;opacity:0.85;">Vùng hiệu ứng: ${escapeHtml(eff.targetZone || "STAGE")}</span>
            </div>
          `;
        }

        if (room.currentRound === "KICKOFF_PRIVATE") {
          const st = room.kickoffPrivateState;
          const activeC = room.contestants[st.activeContestantIdx];
          const q = this.getCurrentKickoffPrivateQuestion(room);
          const showAnswer = (st.questionStatus === "REVEALED" || st.questionStatus === "SCORED");

          return `
            <div class="vtv-stage-wrapper">
              <div class="vtv-stage-inner">
                <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:8px;">
                  <div>
                    <span class="pill role-admin" style="font-size:12px;">VÒNG 1A — KHỞI ĐỘNG RIÊNG</span>
                    <span class="pill" style="margin-left:6px;">Lượt của: <strong style="color:#fda4af;">${st.activeContestantIdx + 1}. ${escapeHtml(activeC.name)}</strong> (Câu ${st.questionIdxInTurn + 1} / 6)</span>
                    <span class="pill" style="margin-left:6px;">Tiến độ: ${st.completedCountByContestant.map((cnt, i) => `TS${i+1}:${cnt}/6`).join(" | ")}</span>
                  </div>
                  <div style="display:flex;align-items:center;gap:10px;">
                    <span style="font-size:12px;color:#93c5fd;font-weight:700;">ĐỒNG HỒ (${q.timeSec || 3} GIÂY):</span>
                    <div class="olympia-timer-ring ${isUrgent ? 'urgent' : ''}" data-live-timer>${timerSecStr}</div>
                  </div>
                </div>

                <div class="vtv-kickoff-layout">
                  <div class="vtv-question-bevel-box">
                    <div>
                      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:12px;color:#7dd3fc;font-weight:700;">
                        <span>CÂU HỎI SỐ ${st.questionIdxInTurn + 1}/6 • CHỦ ĐỀ: ${escapeHtml(q.topic.toUpperCase())} (+${q.points} ĐIỂM)</span>
                        <span>TRẠNG THÁI: ${escapeHtml(st.questionStatus)}</span>
                      </div>
                      ${this.renderQuestionTextAndMedia(room, q, "20px")}
                    </div>

                    <div style="margin-top:16px;padding-top:12px;border-top:1px solid rgba(96,165,250,0.3);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;">
                      <div style="font-size:13.5px;">
                        <span style="color:#94a3b8;">Đáp án thí sinh gửi:</span>
                        <strong style="color:#fde047;margin-left:6px;">
                          ${!st.submittedAnswer
                            ? "(Chưa gửi)"
                            : (st.questionStatus === "REVEALED" || st.questionStatus === "SCORED")
                              ? escapeHtml(st.submittedAnswer)
                              : "⏳ Đang chấm..."}
                        </strong>
                      </div>
                      ${showAnswer ? `
                        <div style="background:rgba(16,185,129,0.2);border:1px solid #10b981;padding:4px 12px;border-radius:6px;font-size:13.5px;color:#6ee7b7;font-weight:800;">
                          ĐÁP ÁN CHUẨN: ${escapeHtml(q.answer)}
                        </div>
                      ` : `
                        <div style="font-size:12px;color:#94a3b8;font-style:italic;">🔒 Đáp án chuẩn đang ẩn trên màn hình công khai</div>
                      `}
                    </div>
                  </div>

                  <div class="vtv-contestant-stack">
                    ${room.contestants.map((c, idx) => {
                      const isTurn = (idx === st.activeContestantIdx);
                      const recentDelta = (c.lastDelta && Date.now() - c.lastDelta.time < 6000) ? c.lastDelta.value : null;
                      return `
                        <div class="vtv-score-row ${isTurn ? 'active-turn' : ''}">
                          <span class="c-name">
                            ${c.seat}.${escapeHtml(c.name)}
                            ${recentDelta !== null && recentDelta !== 0 ? `<span class="score-float-badge ${recentDelta > 0 ? 'plus' : 'minus'}">${recentDelta > 0 ? '+' + recentDelta : recentDelta}</span>` : ""}
                          </span>
                          <span class="c-points">${c.score}</span>
                        </div>
                      `;
                    }).join("")}
                  </div>
                </div>

                ${effectBannerHtml}
              </div>
            </div>
          `;
        }

        if (room.currentRound === "KICKOFF_COMMON") {
          const st = room.kickoffCommonState;
          const q = this.getCurrentKickoffCommonQuestion(room);
          const showAnswer = (st.questionStatus === "REVEALED" || st.questionStatus === "SCORED");
          const winner = room.contestants.find(c => c.id === st.buzzerWinnerId);

          return `
            <div class="vtv-stage-wrapper">
              <div class="vtv-stage-inner">
                <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:8px;">
                  <div>
                    <span class="pill role-contestant" style="font-size:12px;">VÒNG 1B — KHỞI ĐỘNG CHUNG (TÁCH BIỆT VỚI KHỞI ĐỘNG RIÊNG)</span>
                    <span class="pill" style="margin-left:6px;">Câu số: <strong>${st.questionIdx + 1} / ${room.examSnapshot.kickoffCommon.length}</strong></span>
                    <span class="pill" style="margin-left:6px;">Chế độ: <strong>${st.mode === "BUZZER" ? "Bấm chuông giành quyền (+10 / -5)" : "Nhập đáp án độc lập"}</strong></span>
                  </div>
                  <div style="display:flex;align-items:center;gap:10px;">
                    <span class="pill ${st.buzzerState === 'OPEN' ? 'live' : ''}">Chuông: ${escapeHtml(st.buzzerState)}</span>
                    <div class="olympia-timer-ring ${isUrgent ? 'urgent' : ''}" data-live-timer>${timerSecStr}</div>
                  </div>
                </div>

                <div class="vtv-kickoff-layout">
                  <div class="vtv-question-bevel-box">
                    <div>
                      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:12px;color:#67e8f9;font-weight:700;">
                        <span>KHỞI ĐỘNG CHUNG • CÂU ${st.questionIdx + 1}/${room.examSnapshot.kickoffCommon.length} • ${escapeHtml(q.topic.toUpperCase())}</span>
                        <span>${winner ? `🔔 NGƯỜI GIÀNH QUYỀN: ${escapeHtml(winner.name.toUpperCase())}` : "ĐANG CHỜ TÍN HIỆU CHUÔNG"}</span>
                      </div>
                      ${this.renderQuestionTextAndMedia(room, q, "20px")}
                    </div>

                    <div style="margin-top:16px;padding-top:12px;border-top:1px solid rgba(96,165,250,0.3);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;">
                      <div style="font-size:13px;color:#e2e8f0;">
                        ${winner
                          ? `Thí sinh giành chuông: <strong style="color:#fde047;">${escapeHtml(winner.name)}</strong> ${
                              st.answersByContestant[winner.id]
                                ? ((st.questionStatus === "REVEALED" || st.questionStatus === "SCORED")
                                    ? `— Đáp án: <strong style="color:#6ee7b7;">"${escapeHtml(st.answersByContestant[winner.id].text)}"</strong>`
                                    : `— <strong style="color:#fde047;">⏳ Đang chấm...</strong>`)
                                : ""
                            }`
                          : (Object.keys(st.answersByContestant || {}).length > 0
                              ? `Trạng thái đáp án: ${room.contestants.map(c => st.answersByContestant[c.id] ? `${escapeHtml(c.name)}: <strong style="color:#fde047;">${(st.questionStatus === "REVEALED" || st.questionStatus === "SCORED") ? '"' + escapeHtml(st.answersByContestant[c.id].text) + '"' : '⏳ Đang chấm...'}</strong>` : `${escapeHtml(c.name)}: -`).join(" | ")}`
                              : "Cả 4 thí sinh cùng cạnh tranh quyền trả lời")}
                      </div>
                      ${showAnswer ? `
                        <div style="background:rgba(16,185,129,0.2);border:1px solid #10b981;padding:4px 12px;border-radius:6px;font-size:13.5px;color:#6ee7b7;font-weight:800;">
                          ĐÁP ÁN CHUẨN: ${escapeHtml(q.answer)}
                        </div>
                      ` : `<div style="font-size:12px;color:#94a3b8;">🔒 Đáp án ẩn tới khi công bố</div>`}
                    </div>
                  </div>

                  <div class="vtv-contestant-stack">
                    ${room.contestants.map((c) => {
                      const isWinner = (st.buzzerWinnerId === c.id);
                      return `
                        <div class="vtv-score-row common-mode ${isWinner ? 'buzzer-winner' : ''}">
                          <span class="c-name">${c.seat}.${escapeHtml(c.name)} ${isWinner ? '🔔' : ''}</span>
                          <span class="c-points">${c.score}</span>
                        </div>
                      `;
                    }).join("")}
                  </div>
                </div>

                ${effectBannerHtml}
              </div>
            </div>
          `;
        }

        if (room.currentRound === "OBSTACLE") {
          const st = room.obstacleState;
          const obs = room.examSnapshot.obstacle;
          const activeRowIdx = st.selectedRowIdx;
          const activeRowObj = activeRowIdx === 4 ? obs.centerQuestion : obs.rows[activeRowIdx];
          const showCnvSecret = canSeeSecret || st.keywordRevealed;

          return `
            <div class="vtv-stage-wrapper">
              <div class="vtv-stage-inner">
                <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:10px;">
                  <div>
                    <span class="pill role-viewer" style="font-size:12px;">VÒNG 2 — VƯỢT CHƯỚNG NGẠI VẬT</span>
                    <span class="pill" style="margin-left:6px;">
                      Từ khóa CNV:
                      <strong style="color:#fde047;margin-left:4px;">
                        ${showCnvSecret ? escapeHtml(obs.keyword) : `🔒 [ẨN - ${escapeHtml(obs.keywordDisplayCount)}]`}
                      </strong>
                    </span>
                  </div>
                  <div style="display:flex;align-items:center;gap:10px;">
                    <span style="font-size:12px;color:#93c5fd;font-weight:700;">THỜI GIAN HÀNG NGANG (${obs.timePerRowSec || 15}s):</span>
                    <div class="olympia-timer-ring ${isUrgent ? 'urgent' : ''}" data-live-timer>${timerSecStr}</div>
                  </div>
                </div>

                <div class="vtv-obstacle-grid">
                  <div class="vtv-obstacle-image-frame">
                    <img src="${obs.imageUrl}" alt="Hình ảnh Chướng ngại vật" />
                    <div class="vtv-obstacle-cover-layer">
                      ${[0, 1, 2, 3].map(qIdx => `
                        <div class="vtv-obs-quadrant ${st.quadrantsRevealed[qIdx] || st.keywordRevealed ? 'revealed' : ''}">
                          ${qIdx + 1}
                        </div>
                      `).join("")}
                    </div>
                    <div class="vtv-obs-center-tile ${st.centerRevealed || st.keywordRevealed ? 'revealed' : ''}">
                      <span style="font-size:11px;">Ô TRUNG TÂM</span>
                      <span style="font-size:18px;">?</span>

      renderContestantView() {
        const room = this.getActiveRoom();
        const myId = this.session.userId;
        const me = room.contestants.find(c => c.id === myId) || room.contestants[0];
        const round = room.currentRound;

        // Calculate configured timer display
        let configuredSec = 3;
        if (round === "KICKOFF_PRIVATE") configuredSec = this.getCurrentKickoffPrivateQuestion(room)?.timeSec || room.examSnapshot.roundsConfig.kickoffPrivate.timeSec || 3;
        else if (round === "KICKOFF_COMMON") configuredSec = this.getCurrentKickoffCommonQuestion(room)?.timeSec || room.examSnapshot.roundsConfig.kickoffCommon.timeSec || 5;
        else if (round === "OBSTACLE") configuredSec = room.examSnapshot.obstacle.timePerRowSec || 15;
        else if (round === "ACCELERATION") configuredSec = this.getCurrentAccelerationQuestion(room)?.timeSec || 20;
        else if (round === "FINISH") {
          const fq = this.getCurrentFinishQuestion(room);
          configuredSec = room.finishState.questionStatus === "STEAL_WINDOW"
            ? (room.examSnapshot.roundsConfig?.finish?.stealWindowSec || 5)
            : (fq?.timeSec || (fq?.points === 30 ? 20 : 15));
        }
        const remMs = room.timer.status === "IDLE" ? (configuredSec * 1000) : this.getTimerRemainingMs(room);
        const timerSecStr = (remMs / 1000).toFixed(1) + "s";
        const isUrgent = room.timer.status === "RUNNING" && remMs <= 3000;

        // Build Unified [QUESTION FIRST -> ANSWER INPUT IMMEDIATELY BELOW] Panel for the Contestant

        if (round === "KICKOFF_PRIVATE") {
          const st = room.kickoffPrivateState;
          const activeC = room.contestants[st.activeContestantIdx];
          const isMyTurn = (activeC?.id === me.id);
          const q = this.getCurrentKickoffPrivateQuestion(room);
          const canType = isMyTurn && st.questionStatus === "ACCEPTING_ANSWERS" && room.timer.status === "RUNNING";
          const isRevealed = (st.questionStatus === "REVEALED" || st.questionStatus === "SCORED");

      openManualScoreModal() {
        if (!this.requireAdmin()) return;
        const room = this.getActiveRoom();
        const cName = prompt("Nhập số thứ tự thí sinh cần điều chỉnh điểm (1, 2, 3 hoặc 4):", "1");
        if (!cName) return;
        const idx = Number(cName) - 1;
        const target = room.contestants[idx];
        if (!target) {
          alert("Số thứ tự thí sinh không hợp lệ!");
          return;
        }
        const deltaStr = prompt(`Nhập số điểm cần cộng/trừ cho ${target.name} (ví dụ: 10 hoặc -5):`, "10");
        if (deltaStr === null) return;
        const reason = prompt("Nhập lý do điều chỉnh điểm (bắt buộc lưu vào Audit Log):", "Hội đồng giám khảo phúc khảo đáp án");
        if (!reason || !reason.trim()) {
          alert("Phải nhập lý do khi điều chỉnh điểm thủ công!");
          return;
        }
        this.applyScoreChange(room, target.id, Number(deltaStr), `Điều chỉnh thủ công: ${reason.trim()}`);
        this.persistMaster(true);
      },

                    <tr>

                      <td><input class="form-input" value="${escapeHtml(r.question)}" onchange="AppRuntime.updateObstacleRow('${exam.id}', ${idx}, 'question', this.value)" /></td>
                      <td><input class="form-input" style="width:150px;font-weight:800;color:#fde047;" value="${escapeHtml(r.answer)}" onchange="AppRuntime.updateObstacleRow('${exam.id}', ${idx}, 'answer', this.value)" /></td>
                      <td>${r.displayChars.length} ký tự</td>
                      <td><span class="badge badge-published">Đã lưu</span></td>
                    </tr>
                  `).join("")}
                </tbody>
              </table>
            </div>
          `;
        }

        let list = [];
        if (roundView === "KICKOFF_PRIVATE") list = exam.kickoffPrivate;
        else if (roundView === "KICKOFF_COMMON") list = exam.kickoffCommon;
        else if (roundView === "ACCELERATION") list = exam.acceleration;
        else if (roundView === "FINISH") list = exam.finishQuestions;

        return `
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th>#</th>
                  <th>Phân bổ / Chủ đề</th>
                  <th>Nội dung câu hỏi</th>
                  <th>Đáp án chuẩn</th>
                  <th>🎬 Video ngắn</th>
                  <th>Điểm / Giờ</th>
                  <th>Xóa</th>
                </tr>
              </thead>
              <tbody>
                ${list.map((q, idx) => `
                  <tr>
                    <td>${idx + 1}</td>
                    <td style="font-size:12px;">
                      ${q.contestantIndex !== undefined ? `<span class="badge badge-ready">Thí sinh ${q.contestantIndex + 1}</span><br/>` : ""}
                      ${escapeHtml(q.topic || q.title || "Tổng hợp")}
                    </td>
                    <td>
                      <input class="form-input" value="${escapeHtml(q.text)}" onchange="AppRuntime.updateQuestionField('${exam.id}', '${roundView}', ${idx}, 'text', this.value)" />
                    </td>
                    <td>
                      <input class="form-input" style="width:155px;color:#6ee7b7;font-weight:700;" value="${escapeHtml(q.answer)}" onchange="AppRuntime.updateQuestionField('${exam.id}', '${roundView}', ${idx}, 'answer', this.value)" />
                    </td>
                    <td style="white-space:nowrap;">
                      <div style="display:flex;align-items:center;gap:4px;">
                        <label class="btn btn-sm btn-ghost" style="cursor:pointer;margin:0;" title="Tải tệp video ngắn từ máy tính">
                          📁 File
                          <input type="file" accept="video/*" style="display:none;" onchange="AppRuntime.adminHandleVideoFileUpload(this, '${exam.id}', '${roundView}', ${idx})" />
                        </label>
                        <button class="btn btn-sm ${q.videoUrl ? 'btn-emerald' : 'btn-ghost'}"
                                title="Gắn video mô phỏng khoa học 5s mẫu"
                                onclick="AppRuntime.updateQuestionField('${exam.id}', '${roundView}', ${idx}, 'videoUrl', BROADCAST_ASSETS['sample_video_question.mp4'] ? BROADCAST_ASSETS['sample_video_question.mp4'].data_uri : '')">
                          ${q.videoUrl ? '🎬 Có Video' : '🎬 Mẫu'}
                        </button>
                        ${q.videoUrl ? `
                          <button class="btn btn-sm btn-crimson" title="Xóa video khỏi câu hỏi" onclick="AppRuntime.updateQuestionField('${exam.id}', '${roundView}', ${idx}, 'videoUrl', '')">✕</button>
                        ` : ""}
                      </div>
                    </td>
                    <td style="font-size:12px;white-space:nowrap;">
                      <div style="display:flex;align-items:center;gap:6px;">
                        <input type="number" min="0" max="200" class="form-input" style="width:64px;padding:4px 6px;text-align:center;"
                               value="${q.points ?? 10}" title="Điểm số"
                               onchange="AppRuntime.updateQuestionField('${exam.id}', '${roundView}', ${idx}, 'points', Number(this.value))" />
                        <span>đ /</span>
                        <input type="number" min="1" max="600" class="form-input" style="width:64px;padding:4px 6px;text-align:center;color:#fde047;font-weight:800;"
                               value="${q.timeSec ?? 15}" title="Thời gian trả lời (giây)"
                               onchange="AppRuntime.updateQuestionField('${exam.id}', '${roundView}', ${idx}, 'timeSec', Number(this.value))" />
                        <span>giây</span>
                      </div>
                    </td>
                    <td>
                      <button class="btn btn-sm btn-crimson" onclick="AppRuntime.deleteQuestionFromExam('${exam.id}', '${roundView}', ${idx})">✕</button>
                    </td>
                  </tr>
                `).join("")}
              </tbody>
            </table>
          </div>
        `;
      },

      updateExamMeta(examId, field, value) {
        if (!this.requireAdmin()) return;
        const ex = this.master.exams.find(e => e.id === examId);
        if (!ex) return;
        ex[field] = value;
        ex.version += 1;
        ex.updatedAt = "2026-10-14 " + new Date().toTimeString().slice(0, 5);
        this.logAudit(this.session.username, "ADMIN", "EXAM_UPDATED", `Cập nhật ${field} của đề ${ex.code} (v${ex.version})`);
        this.persistMaster(true);
      },

      updateObstacleKeyword(examId, kw) {
        if (!this.requireAdmin()) return;
        const ex = this.master.exams.find(e => e.id === examId);
        if (!ex) return;
        const cleaned = String(kw || "").trim().toUpperCase();
        ex.obstacle.keyword = cleaned;
        const charCount = cleaned.replace(/\s+/g, "").length;
        ex.obstacle.keywordDisplayCount = `${charCount} CHỮ CÁI`;
        ex.obstacle.acceptedKeywords = [cleaned];
        this.persistMaster(true);
      },

      updateObstacleRow(examId, rowIdx, field, val) {
        if (!this.requireAdmin()) return;
        const ex = this.master.exams.find(e => e.id === examId);
        if (!ex || !ex.obstacle.rows[rowIdx]) return;
        ex.obstacle.rows[rowIdx][field] = val;
        if (field === "answer") {
          const cleanChars = String(val || "").trim().toUpperCase().replace(/\s+/g, "").split("");
          ex.obstacle.rows[rowIdx].displayChars = cleanChars;
          ex.obstacle.rows[rowIdx].accepted = [String(val || "").trim().toUpperCase()];
        }
        this.persistMaster(true);
      },

      updateQuestionField(examId, roundView, qIdx, field, val) {
        if (!this.requireAdmin()) return;
        const ex = this.master.exams.find(e => e.id === examId);
        if (!ex) return;
        const map = {
          KICKOFF_PRIVATE: ex.kickoffPrivate,
          KICKOFF_COMMON: ex.kickoffCommon,
          ACCELERATION: ex.acceleration,
          FINISH: ex.finishQuestions
        };
        const arr = map[roundView];
        if (!arr || !arr[qIdx]) return;
        arr[qIdx][field] = val;
        if (field === "answer") {
          arr[qIdx].accepted = [val];
        }
        const room = this.getActiveRoom();
        if (room && room.examId === examId && room.examSnapshot) {
          const snapMap = {
            KICKOFF_PRIVATE: room.examSnapshot.kickoffPrivate,
            KICKOFF_COMMON: room.examSnapshot.kickoffCommon,
            ACCELERATION: room.examSnapshot.acceleration,
            FINISH: room.examSnapshot.finishQuestions
          };
          if (snapMap[roundView] && snapMap[roundView][qIdx]) {
            snapMap[roundView][qIdx][field] = val;
            if (field === "answer") snapMap[roundView][qIdx].accepted = [val];
          }
        }
        ex.version += 1;
        this.persistMaster(true);
      },

      addNewQuestionToCurrentView(examId) {
        if (!this.requireAdmin()) return;
        const ex = this.master.exams.find(e => e.id === examId);
        if (!ex) return;
        const rv = this.examFilter.roundView;
        if (rv === "KICKOFF_PRIVATE") {
          ex.kickoffPrivate.push({
            id: "kp_new_" + Date.now(),
            contestantIndex: 0,
            order: ex.kickoffPrivate.length + 1,
            topic: "Kiến thức chung",
            difficulty: "MEDIUM",
            type: "SHORT_TEXT",
            timeSec: 3,
            points: 10,
            text: "Câu hỏi Khởi động riêng mới (nhập nội dung tại đây)...",
            answer: "Đáp án mới",
            accepted: ["Đáp án mới"]
          });
        } else if (rv === "KICKOFF_COMMON") {
          ex.kickoffCommon.push({
            id: "kc_new_" + Date.now(),
            order: ex.kickoffCommon.length + 1,
            topic: "Tổng hợp",
            difficulty: "MEDIUM",
            type: "SHORT_TEXT",
            timeSec: 5,
            points: 10,
            wrongPenalty: -5,
            text: "Câu hỏi Khởi động chung mới...",
            answer: "Đáp án mới",
            accepted: ["Đáp án mới"]
          });
        } else if (rv === "ACCELERATION") {
          ex.acceleration.push({
            id: "acc_new_" + Date.now(),
            order: ex.acceleration.length + 1,
            title: `Tăng tốc ${ex.acceleration.length + 1} (30 giây)`,
            type: "SHORT_TEXT",
            timeSec: 30,
            pointsRank: [40, 30, 20, 10],
            text: "Câu hỏi Tăng tốc mới...",
            answer: "ĐÁP ÁN",
            accepted: ["ĐÁP ÁN"]
          });
        } else if (rv === "FINISH") {
          ex.finishQuestions.push({
            id: "fin_new_" + Date.now(),
            points: 20,
            timeSec: 15,
            topic: "Tổng hợp",
            text: "Câu hỏi Về đích mới (20 điểm)...",
            answer: "Đáp án mới",
            accepted: ["Đáp án mới"]
          });
        }
        this.persistMaster(true);
      },

      deleteQuestionFromExam(examId, roundView, qIdx) {
        if (!this.requireAdmin()) return;
        const ex = this.master.exams.find(e => e.id === examId);
        if (!ex) return;
        if (!confirm("Bạn có chắc chắn muốn xóa câu hỏi này khỏi đề thi?")) return;
        const map = {
          KICKOFF_PRIVATE: ex.kickoffPrivate,
          KICKOFF_COMMON: ex.kickoffCommon,
          ACCELERATION: ex.acceleration,
          FINISH: ex.finishQuestions
        };
        if (map[roundView]) {
          map[roundView].splice(qIdx, 1);
          this.persistMaster(true);
        }
      },

      createNewBlankExam() {
        if (!this.requireAdmin()) return;
        const base = createDefaultExam2();
        const code = prompt("Nhập mã đề thi mới:", "OLP-NEW-2026");
        if (!code) return;
        const title = prompt("Nhập tên đề thi mới:", "Đề Thi Olympia Mới");
        if (!title) return;
        base.id = "exam_" + Date.now();
        base.code = code.trim().toUpperCase();
        base.title = title.trim();
        base.status = "DRAFT";
        base.version = 1;
        this.master.exams.push(base);
        this.examFilter.editingExamId = base.id;
        this.logAudit(this.session.username, "ADMIN", "EXAM_CREATED", `Tạo đề mới ${base.code}`);
        this.persistMaster(true);
      },

      deleteOrArchiveExam(examId) {
        if (!this.requireAdmin()) return;
        const ex = this.master.exams.find(e => e.id === examId);
        if (!ex) return;
        const inUse = this.master.rooms.some(r => r.examId === examId);
        if (inUse) {
          alert(`Đề ${ex.code} đang được tham chiếu bởi phòng thi. Theo quy tắc bảo toàn lịch sử (Mục 6.5), hệ thống sẽ chuyển đề sang trạng thái ARCHIVED (Lưu trữ) thay vì xóa vĩnh viễn.`);
          ex.status = "ARCHIVED";
          this.persistMaster(true);
          return;
        }
        if (confirm(`Xác nhận xóa bộ đề ${ex.code} (${ex.title})?`)) {
          this.master.exams = this.master.exams.filter(e => e.id !== examId);
          this.examFilter.editingExamId = this.master.exams[0]?.id || "";
          this.persistMaster(true);
        }
      },

      exportExamJson(examId) {
        const ex = this.master.exams.find(e => e.id === examId);
        if (!ex) return;
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(ex, null, 2));
        const a = document.createElement("a");
        a.setAttribute("href", dataStr);
        a.setAttribute("download", `${ex.code}_olympia_arena.json`);
        document.body.appendChild(a);
        a.click();
        a.remove();
      },

      promptImportExamJson() {
        if (!this.requireAdmin()) return;
        const raw = prompt("Dán nội dung JSON của đề thi hoặc dòng CSV mẫu (Vòng,Nội dung,Đáp án,Điểm,Giây) để nhập vào ngân hàng đề:");
        if (!raw || !raw.trim()) return;
        try {
          const parsed = JSON.parse(raw);
          if (parsed && parsed.code && parsed.title) {
            parsed.id = "exam_imp_" + Date.now();
            this.master.exams.push(parsed);
            this.examFilter.editingExamId = parsed.id;
            alert(`Nhập đề JSON thành công: ${parsed.code}`);
            this.persistMaster(true);
            return;
          }
        } catch (e) {
          const lines = raw.trim().split("\n");
          const targetEx = this.master.exams.find(e => e.id === this.examFilter.editingExamId) || this.master.exams[0];
          let added = 0;
          lines.forEach(line => {
            const parts = line.split(",");
            if (parts.length >= 3) {
              targetEx.kickoffCommon.push({
                id: "kc_csv_" + Date.now() + "_" + added,
                order: targetEx.kickoffCommon.length + 1,
                topic: parts[0].trim() || "CSV Import",
                difficulty: "MEDIUM",
                type: "SHORT_TEXT",
                timeSec: Number(parts[4] || 5),
                points: Number(parts[3] || 10),
                wrongPenalty: -5,
                text: parts[1].trim(),
                answer: parts[2].trim(),
                accepted: [parts[2].trim()]
              });
              added += 1;
            }
          });
          alert(`Đã kiểm tra và nhập thành công ${added} câu hỏi từ CSV vào đề ${targetEx.code}!`);
          this.persistMaster(true);
        }
      },

      renderAdminEffectsStudio(room) {

        return `
          <div class="panel">

            </div>

            <div style="background:linear-gradient(135deg,#041024 0%,#0b2957 100%);border:2px dashed #00d4ff;border-radius:10px;padding:16px;margin-bottom:18px;">

                <span style="font-size:12px;font-weight:800;color:#67e8f9;text-transform:uppercase;">

            <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:14px;">

                    <label style="font-size:12px;display:flex;align-items:center;gap:4px;cursor:pointer;color:#67e8f9;">

                    </label>

                  </div>
                  <div class="form-group" style="margin-bottom:10px;">

                        <option value="${st.id}" ${item.selectedStyle === st.id ? "selected" : ""}>

          triggeredAt: Date.now()
        };

          OlympiaAudio.play(cfg.soundKey, this.master.audioConfig);
