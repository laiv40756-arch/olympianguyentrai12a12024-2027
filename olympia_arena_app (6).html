      createNewRoomPrompt() {
        if (!this.requireAdmin()) return;
        const code = prompt("Nhập mã phòng thi mới:", "OLP-2026-C");
        if (!code) return;
        const name = prompt("Nhập tên cuộc thi / phòng thi:", "Chung Kết Giao Hữu Liên Trường");
        if (!name) return;
        const ex = this.master.exams[0];
        const newR = createInitialRoom("room_" + Date.now(), code.trim().toUpperCase(), name.trim(), ex);
        this.master.rooms.push(newR);
        this.master.activeRoomId = newR.id;
        this.session.roomCode = newR.code;
        this.logAudit(this.session.username, "ADMIN", "ROOM_CREATED", `Tạo phòng thi mới ${newR.code}`);
        this.persistMaster(true);
      },

      resetRoomConfirm(roomId) {
        if (!this.requireAdmin()) return;
        const idx = this.master.rooms.findIndex(r => r.id === roomId);
        if (idx < 0) return;
        const oldR = this.master.rooms[idx];
        if (!confirm(`Xác nhận đặt lại toàn bộ điểm số và trạng thái của phòng ${oldR.code} về ban đầu?`)) return;
        const ex = this.master.exams.find(e => e.id === oldR.examId) || this.master.exams[0];
        this.master.rooms[idx] = createInitialRoom(oldR.id, oldR.code, oldR.name, ex);
        this.persistMaster(true);
      },

      renderAdminUsersManager() {
        return `
          <div class="panel" style="border-color:#fbbf24;">
            <div class="panel-header">
              <div class="panel-title">🔑 Đổi Mật Khẩu Admin Mới (Tự Động Vô Hiệu Hóa Mật Khẩu Cũ)</div>
              <span class="badge badge-published">Bảo mật SHA-256 + Chặn mật khẩu cũ</span>
            </div>
            <form onsubmit="event.preventDefault(); AppRuntime.adminChangeNewPassword(document.getElementById('adm-old-p').value, document.getElementById('adm-new-p').value, document.getElementById('adm-cfm-p').value);"
                  style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;align-items:end;">
              <div>
                <label class="form-label">Mật khẩu Admin hiện tại</label>
                <input id="adm-old-p" type="password" autocomplete="off" class="form-input" placeholder="Nhập mật khẩu hiện tại" required />
              </div>
              <div>
                <label class="form-label">Mật khẩu Admin mới (tối thiểu 6 ký tự)</label>
                <input id="adm-new-p" type="password" autocomplete="new-password" class="form-input" placeholder="Nhập mật khẩu mới" required />
              </div>
              <div>
                <label class="form-label">Xác nhận mật khẩu Admin mới</label>
                <input id="adm-cfm-p" type="password" autocomplete="new-password" class="form-input" placeholder="Nhập lại mật khẩu mới" required />
              </div>
              <div>
                <button type="submit" class="btn btn-gold" style="width:100%;padding:10px;">
                  🔒 Lưu Mật Khẩu Mới & Hủy Mật Khẩu Cũ
                </button>
              </div>
            </form>
          </div>

          <div class="panel">
            <div class="panel-header">
              <div class="panel-title">👥 Quản Trị Tài Khoản, Thí Sinh & Phân Quyền (RBAC)</div>
            </div>
            <div class="table-wrap">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>Tài khoản</th>
                    <th>Họ và Tên hiển thị</th>
                    <th>Vai trò</th>
                    <th>Trường / Đơn vị</th>
                    <th>Phòng phân công</th>
                    <th>Trạng thái</th>
                    <th>Bảo mật</th>
                  </tr>
                </thead>
                <tbody>
                  ${this.master.users.map((u, idx) => `
                    <tr>
                      <td><code>${escapeHtml(u.username)}</code></td>
                      <td>
                        <input class="form-input" value="${escapeHtml(u.fullName)}" onchange="AppRuntime.updateUserProfile(${idx}, 'fullName', this.value)" />
                      </td>
                      <td><span class="badge badge-ready">${escapeHtml(u.role)} ${u.seat ? `(Vị trí ${u.seat})` : ""}</span></td>
                      <td>
                        <input class="form-input" value="${escapeHtml(u.school)}" onchange="AppRuntime.updateUserProfile(${idx}, 'school', this.value)" />
                      </td>
                      <td>${escapeHtml(u.assignedRoomCode)}</td>
                      <td>
                        <span class="badge ${u.status === 'ACTIVE' ? 'badge-published' : 'badge-draft'}">${escapeHtml(u.status)}</span>
                      </td>
                      <td>
                        <div style="display:flex;gap:6px;">
                          <button class="btn btn-sm btn-ghost" onclick="AppRuntime.resetUserPasswordPrompt(${idx})">🔑 Đổi mật khẩu</button>
                          ${u.role !== "ADMIN" ? `
                            <button class="btn btn-sm ${u.status==='ACTIVE'?'btn-crimson':'btn-emerald'}" onclick="AppRuntime.toggleUserLock(${idx})">
                              ${u.status === "ACTIVE" ? "🔒 Khóa" : "🔓 Mở khóa"}
                            </button>
                          ` : ""}
                        </div>
                      </td>
                    </tr>
                  `).join("")}
                </tbody>
              </table>
            </div>
          </div>
        `;
      },

      updateUserProfile(userIdx, field, val) {
        if (!this.requireAdmin()) return;
        const u = this.master.users[userIdx];
        if (!u) return;
        u[field] = val;
        if (u.role === "CONTESTANT" && u.seat) {
          this.master.rooms.forEach(r => {
            const c = r.contestants.find(x => x.seat === u.seat);
            if (c) {
              if (field === "fullName") c.name = val.replace(/^\d+\.\s*/, "");
              if (field === "school") c.school = val;
            }
          });
        }
        this.persistMaster(true);
      },

      resetUserPasswordPrompt(userIdx) {
        if (!this.requireAdmin()) return;
        const u = this.master.users[userIdx];
        const newPass = prompt(`Nhập mật khẩu mới cho tài khoản ${u.username} (sẽ được băm SHA-256 trước khi lưu):`);
        if (!newPass || newPass.length < 4) {
          alert("Mật khẩu mới phải có ít nhất 4 ký tự!");
          return;
        }
        u.passwordHash = simpleHash(newPass);
        u.failedAttempts = 0;
        u.status = "ACTIVE";
        this.logAudit(this.session.username, "ADMIN", "PASSWORD_CHANGED", `Cập nhật mật khẩu băm cho tài khoản ${u.username}`);
        alert(`Đã cập nhật mật khẩu an toàn cho ${u.username}!`);
        this.persistMaster(true);
      },

      toggleUserLock(userIdx) {
        if (!this.requireAdmin()) return;
        const u = this.master.users[userIdx];
        u.status = (u.status === "ACTIVE") ? "LOCKED" : "ACTIVE";
        u.failedAttempts = 0;
        this.persistMaster(true);
      },

      renderAdminResultsAndHistory(room) {
        const sorted = [...room.contestants].sort((a, b) => b.score - a.score);
        return `
          <div class="panel">
            <div class="panel-header">
              <div class="panel-title">🏆 Bảng Xếp Hạng Tổng Hợp Theo Từng Vòng Thi — Phòng ${escapeHtml(room.code)}</div>
              <div style="display:flex;gap:8px;flex-wrap:wrap;">
                <button class="btn btn-emerald btn-sm" onclick="AppRuntime.restartCompetitionMatch(null, false)">🔄 Lưu Kết Quả Này & Thi Lại Từ Đầu</button>
                <button class="btn btn-gold btn-sm" onclick="AppRuntime.restartCurrentRoundOnly(false)">🔁 Thi Lại Vòng Hiện Tại</button>
                <button class="btn btn-primary btn-sm" onclick="AppRuntime.exportResultsCsv()">⬇ Xuất Báo Cáo Điểm (CSV)</button>
              </div>
            </div>
            <div class="table-wrap">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>Hạng</th>
                    <th>Thí Sinh</th>
                    <th>Trường</th>
                    <th>1A. Khởi động riêng</th>
                    <th>1B. Khởi động chung</th>
                    <th>2. VCNV</th>
                    <th>3. Tăng tốc</th>
                    <th>4. Về đích</th>
                    <th>TỔNG ĐIỂM</th>
                  </tr>
                </thead>
                <tbody>
                  ${sorted.map((c, idx) => `
                    <tr>
                      <td><strong>#${idx + 1}</strong></td>
                      <td><strong style="color:#67e8f9;">${escapeHtml(c.name)}</strong></td>
                      <td>${escapeHtml(c.school)}</td>
                      <td>${c.roundScores.KICKOFF_PRIVATE || 0}</td>
                      <td>${c.roundScores.KICKOFF_COMMON || 0}</td>
                      <td>${c.roundScores.OBSTACLE || 0}</td>
                      <td>${c.roundScores.ACCELERATION || 0}</td>
                      <td>${c.roundScores.FINISH || 0}</td>
                      <td style="font-size:18px;font-weight:900;color:#fde047;">${c.score}</td>
                    </tr>
                  `).join("")}
                </tbody>
              </table>
            </div>
          </div>

          <div class="panel">
            <div class="panel-header">
              <div class="panel-title">📜 Lịch Sử Sự Kiện Điểm Số Chi Tiết (Score Events Replay Log)</div>
            </div>
            ${room.scoreEvents.length === 0 ? `
              <div style="padding:18px;text-align:center;color:#94a3b8;">Chưa có sự kiện biến thiên điểm số nào trong phiên hiện tại. Hãy chấm điểm ở mục Điều khiển trận đấu!</div>
            ` : `
              <div class="table-wrap">
                <table class="data-table">
                  <thead>
                    <tr>
                      <th>Thời điểm</th>
                      <th>Vòng thi</th>
                      <th>Thí sinh</th>
                      <th>Điểm trước</th>
                      <th>Thay đổi</th>
                      <th>Điểm sau</th>
                      <th>Lý do / Sự kiện</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${room.scoreEvents.map(ev => `
                      <tr>
                        <td style="font-family:var(--font-mono);">${escapeHtml(ev.timestamp)}</td>
                        <td><span class="badge badge-ready">${escapeHtml(ev.round)}</span></td>
                        <td><strong>${escapeHtml(ev.contestantName)}</strong></td>
                        <td>${ev.before}</td>
                        <td style="color:${ev.change >= 0 ? '#6ee7b7' : '#fca5a5'};font-weight:800;">
                          ${ev.change >= 0 ? '+' + ev.change : ev.change}
                        </td>
                        <td><strong>${ev.after}</strong></td>
                        <td>${escapeHtml(ev.reason)}</td>
                      </tr>
                    `).join("")}
                  </tbody>
                </table>
              </div>
            `}
          </div>

          <div class="panel">
            <div class="panel-header">
              <div class="panel-title">🗂 Lịch Sử Các Lượt Thi Đã Hoàn Thành Trước Khi Thi Lại (${(room.matchArchives || []).length} lượt)</div>
            </div>
            ${(!room.matchArchives || room.matchArchives.length === 0) ? `
              <div style="padding:16px;text-align:center;color:#94a3b8;">
                Chưa có lượt thi cũ nào được lưu. Khi bạn nhấn <strong>"🔄 Thi Lại Từ Đầu"</strong> sau khi thi xong, kết quả trận trước sẽ tự động được lưu trữ tại đây!
              </div>
            ` : `
              <div class="table-wrap">
                <table class="data-table">
                  <thead>
                    <tr>
                      <th>Lượt Thi</th>
                      <th>Thời Điểm Kết Thúc</th>
                      <th>Mã Đề</th>
                      <th>Quán Quân</th>
                      <th>Điểm Chi Tiết 4 Thí Sinh</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${room.matchArchives.map((arch, idx) => `
                      <tr>
                        <td><strong>Lượt #${room.matchArchives.length - idx}</strong></td>
                        <td style="font-family:var(--font-mono);font-size:12px;">${escapeHtml(arch.finishedAt)}</td>
                        <td><span class="badge badge-ready">${escapeHtml(arch.examCode)}</span></td>
                        <td><strong style="color:#fde047;">♛ ${escapeHtml(arch.winnerName)} (${arch.winnerScore}đ)</strong></td>
                        <td style="font-size:12px;">
                          ${arch.standings.map(s => `${s.rank}. ${escapeHtml(s.name)}: <strong>${s.totalScore}đ</strong>`).join(" • ")}
                        </td>
                      </tr>
                    `).join("")}
                  </tbody>
                </table>
              </div>
            `}
          </div>
        `;
      },

      exportResultsCsv() {
        const room = this.getActiveRoom();
        const header = "Hang,ThiSinh,Truong,KhoiDongRieng,KhoiDongChung,VCNV,TangToc,VeDich,TongDiem\n";
        const sorted = [...room.contestants].sort((a, b) => b.score - a.score);
        const rows = sorted.map((c, i) =>
          `${i+1},"${c.name}","${c.school}",${c.roundScores.KICKOFF_PRIVATE||0},${c.roundScores.KICKOFF_COMMON||0},${c.roundScores.OBSTACLE||0},${c.roundScores.ACCELERATION||0},${c.roundScores.FINISH||0},${c.score}`
        ).join("\n");
        const uri = "data:text/csv;charset=utf-8," + encodeURIComponent(header + rows);
        const a = document.createElement("a");
        a.setAttribute("href", uri);
        a.setAttribute("download", `KetQua_${room.code}.csv`);
        document.body.appendChild(a);
        a.click();
        a.remove();
      },

      renderAdminTestCenter() {
        if (!this.testReport) {
          this.runAutomatedVerificationSuite();
        }
        const rep = this.testReport;
        return `
          <div class="panel">
            <div class="panel-header">
              <div class="panel-title">✅ Hệ Thống Kiểm Thử Nghiệm Thu Tự Động (Section 28 — 10 Hạng Mục)</div>
              <button class="btn btn-emerald btn-sm" onclick="AppRuntime.runAutomatedVerificationSuite();AppRuntime.render();">
                ▶ Chạy Lại Toàn Bộ Kiểm Thử (${rep.passed}/${rep.total} PASS)
              </button>
            </div>
            <div class="table-wrap">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>Nhóm Kiểm Thử</th>
                    <th>Kịch Bản Kiểm Chứng</th>
                    <th>Kết Quả</th>
                    <th>Bằng Chứng Thực Thi</th>
                  </tr>
                </thead>
                <tbody>
                  ${rep.results.map(r => `
                    <tr>
                      <td><strong>${escapeHtml(r.suite)}</strong></td>
                      <td>${escapeHtml(r.name)}</td>
                      <td>
                        <span class="badge ${r.passed ? 'badge-published' : 'badge-draft'}">
                          ${r.passed ? "PASS" : "FAIL"}
                        </span>
                      </td>
                      <td style="font-family:var(--font-mono);font-size:12px;color:#cbd5e1;">${escapeHtml(r.detail)}</td>
                    </tr>
                  `).join("")}
                </tbody>
              </table>
            </div>
          </div>
        `;
      },

      renderAdminVtvReferenceGallery() {
        const items = [
          { file: "image_4cdc59.jpg", round: "KICKOFF_PRIVATE", title: "Ảnh 1: Khởi Động Riêng (1. Duy Khoa - Đỏ hồng nổi bật)", desc: "Khung câu hỏi xanh vát góc trái, cột điểm 4 thí sinh bên phải với thanh màu đỏ hồng cho thí sinh đang thi." },
          { file: "image_4cdf3d.png", round: "KICKOFF_COMMON", title: "Ảnh 2: Khởi Động Chung (4 Thí Sinh Thanh Xanh Viền Cyan)", desc: "Câu hỏi 'Được mùa nhãn, hạn nước lên' họ Bồ hòn; cả 4 thanh thí sinh màu xanh đậm có tam giác góc cyan." },
          { file: "image_4ce33e.jpg", round: "OBSTACLE", title: "Ảnh 3: Vượt Chướng Ngại Vật (5 Chữ Cái — Xuân / 2025 / Bắc Ninh / Quảng Ninh)", desc: "Hình ảnh chuông đồng góc trái, bảng 4 hàng ngang chữ tròn 3D bóng màu xanh cyan góc phải." },
          { file: "image_4ce73f.jpg", round: "ACCELERATION", title: "Ảnh 4: Tăng Tốc (Công Bố Đáp Án & Thời Gian 5.09 / 25.39 / 36.33 / 37.50)", desc: "Trục thời gian dọc màu cyan bên trái nối chấm trắng với 4 thẻ đáp án xếp theo tốc độ." },
          { file: "image_4ce7b2.jpg", round: "FINISH", title: "Ảnh 5: Về Đích (Gói 20 / 20 / 20 — Câu Hỏi Từ Trường Trái Đất)", desc: "Khung ngang cánh chevron, dãy tên 4 thí sinh phía trên và cột mức điểm 20 lớn bên phải." }
        ];

        return `
          <div class="panel">
            <div class="panel-header">
              <div class="panel-title">🖼 Đối Chiếu Trực Tiếp 5 Hình Ảnh Mẫu Truyền Hình VTV3 Đã Tải Lên</div>
            </div>
            <p style="font-size:13px;color:#cbd5e1;margin-bottom:14px;">
              Tất cả 5 giao diện vòng thi trong <strong>OLYMPIA ARENA</strong> đều được thiết kế bám sát từng chi tiết bố cục, màu sắc và nội dung câu hỏi từ 5 bức ảnh truyền hình thực tế dưới đây. Nhấn nút trên từng thẻ để mở ngay vòng thi tương ứng:
            </p>
            <div class="reference-gallery-grid">
              ${items.map(it => `
                <div class="ref-card">
                  <img src="${BROADCAST_ASSETS[it.file] ? BROADCAST_ASSETS[it.file].data_uri : ''}" alt="${escapeHtml(it.title)}" />
                  <div class="ref-card-body">
                    <strong style="color:#67e8f9;display:block;margin-bottom:4px;">${escapeHtml(it.title)}</strong>
                    <p style="color:#94a3b8;margin-bottom:10px;">${escapeHtml(it.desc)}</p>
                    <button class="btn btn-sm btn-primary" style="width:100%;" onclick="AppRuntime.adminTab='LIVE_CONTROL';AppRuntime.switchRound('${it.round}');">
                      🎯 Mở Ngay Vòng Thi Này Trên Sân Khấu
                    </button>
                  </div>
                </div>
              `).join("")}
            </div>
          </div>
        `;
      },

      render() {
        const root = document.getElementById("app");
        if (!root) return;

        let bodyHtml = "";
        if (!this.session) {
          bodyHtml = this.renderLoginView();
        } else if (this.session.role === "ADMIN") {
          bodyHtml = this.renderAdminShell();
        } else if (this.session.role === "CONTESTANT") {
          bodyHtml = this.renderContestantView();
        } else {
          bodyHtml = this.renderViewerProjectionScreen();
        }

        root.innerHTML = this.renderTopBar() + bodyHtml;
      }
    });

    window.addEventListener("DOMContentLoaded", () => {
      AppRuntime.init();
    });
  </script>
</body>
</html>
