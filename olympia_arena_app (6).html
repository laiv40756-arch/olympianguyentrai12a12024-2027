<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OLYMPIA ARENA — Hệ Thống Thi Đấu Đường Lên Đỉnh Olympia</title>
  <style>
    :root {
      --bg-deep: #030b1a;
      --bg-stage: #06152d;
      --bg-panel: #0a2146;
      --bg-panel-alt: #0f2d5e;
      --bg-card: #12356e;
      --border-cyan: #00d4ff;
      --border-steel: #5c8bc0;
      --accent-cyan: #00e5ff;
      --accent-blue: #0077ff;
      --accent-crimson: #d4144c;
      --accent-crimson-dark: #960932;
      --accent-gold: #fbbf24;
      --accent-emerald: #10b981;
      --accent-danger: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-cyan: #67e8f9;
      --font-sans: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      --font-mono: 'JetBrains Mono', Consolas, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      background: radial-gradient(circle at 50% 15%, #0c2b5e 0%, #051329 55%, #020813 100%);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      line-height: 1.45;
    }

    body.reduced-motion *,
    body.reduced-motion *::before,
    body.reduced-motion *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #041022; }
    ::-webkit-scrollbar-thumb { background: #1e4b8f; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #00d4ff; }

    /* TOP GLOBAL BAR */
    .top-utility-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 18px;
      background: rgba(3, 11, 26, 0.94);
      border-bottom: 1px solid rgba(0, 212, 255, 0.35);
      backdrop-filter: blur(8px);
      position: sticky;
      top: 0;
      z-index: 100;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand-cluster {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    .laurel-emblem {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #fde047, #ca8a04 70%, #713f12 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      color: #041022;
      box-shadow: 0 0 14px rgba(251, 191, 36, 0.55);
      border: 2px solid #fef08a;
      font-size: 16px;
      flex-shrink: 0;
    }

    .brand-title-wrap h1 {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.8px;
      background: linear-gradient(90deg, #ffffff 0%, #7dd3fc 55%, #fbbf24 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    .brand-title-wrap p {
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 0.3px;
    }

    .top-status-pills {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      background: rgba(15, 45, 94, 0.75);
      border: 1px solid rgba(92, 139, 192, 0.45);
      color: #e2e8f0;
    }

    .pill.live {
      background: rgba(16, 185, 129, 0.18);
      border-color: #10b981;
      color: #6ee7b7;
    }

    .pill.role-admin {
      background: rgba(212, 20, 76, 0.25);
      border-color: #f43f5e;
      color: #fda4af;
    }

    .pill.role-contestant {
      background: rgba(0, 212, 255, 0.2);
      border-color: #00d4ff;
      color: #67e8f9;
    }

    .pill.role-viewer {
      background: rgba(251, 191, 36, 0.2);
      border-color: #fbbf24;
      color: #fde68a;
    }

    .dot-indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
    }

    /* BUTTONS */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.16s ease;
      font-family: inherit;
      text-decoration: none;
      white-space: nowrap;
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      filter: grayscale(0.4);
    }

    .btn-primary {
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      border-color: #38bdf8;
      color: #fff;
      box-shadow: 0 2px 10px rgba(2, 132, 199, 0.35);
    }
    .btn-primary:hover:not(:disabled) {
      background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
      box-shadow: 0 0 14px rgba(56, 189, 248, 0.6);
    }

    .btn-crimson {
      background: linear-gradient(135deg, #d4144c 0%, #9e0b37 100%);
      border-color: #fb7185;
      color: #fff;
      box-shadow: 0 2px 10px rgba(212, 20, 76, 0.4);
    }
    .btn-crimson:hover:not(:disabled) {
      background: linear-gradient(135deg, #e11d48 0%, #be123c 100%);
      box-shadow: 0 0 15px rgba(244, 63, 94, 0.65);
    }

    .btn-emerald {
      background: linear-gradient(135deg, #059669 0%, #047857 100%);
      border-color: #34d399;
      color: #fff;
    }
    .btn-emerald:hover:not(:disabled) {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
    }

    .btn-gold {
      background: linear-gradient(135deg, #d97706 0%, #b45309 100%);
      border-color: #fbbf24;
      color: #fff;
    }
    .btn-gold:hover:not(:disabled) {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
    }

    .btn-ghost {
      background: rgba(15, 45, 94, 0.65);
      border-color: rgba(92, 139, 192, 0.5);
      color: #e2e8f0;
    }
    .btn-ghost:hover:not(:disabled) {
      border-color: #00d4ff;
      color: #fff;
      background: rgba(18, 57, 118, 0.9);
    }

    .btn-sm { padding: 5px 10px; font-size: 12px; }
    .btn-lg { padding: 12px 22px; font-size: 15px; }

    /* INPUTS & FORMS */
    .form-group { margin-bottom: 14px; }
    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #93c5fd;
      margin-bottom: 5px;
    }
    .form-input, .form-select, .form-textarea {
      width: 100%;
      padding: 9px 12px;
      border-radius: 6px;
      background: rgba(4, 15, 35, 0.88);
      border: 1px solid rgba(92, 139, 192, 0.55);
      color: #fff;
      font-size: 13.5px;
      font-family: inherit;
      transition: border-color 0.15s;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus {
      outline: none;
      border-color: #00d4ff;
      box-shadow: 0 0 0 2px rgba(0, 212, 255, 0.2);
    }

    /* LOGIN VIEW */
    .login-stage {
      min-height: calc(100vh - 58px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 16px;
      background:
        radial-gradient(circle at 20% 20%, rgba(0, 212, 255, 0.14) 0%, transparent 45%),
        radial-gradient(circle at 80% 30%, rgba(212, 20, 76, 0.14) 0%, transparent 45%),
        radial-gradient(circle at 50% 80%, rgba(251, 191, 36, 0.1) 0%, transparent 50%);
    }

    .login-container {
      width: 100%;
      max-width: 980px;
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      background: rgba(7, 23, 51, 0.92);
      border: 2px solid rgba(0, 212, 255, 0.45);
      border-radius: 14px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7), 0 0 35px rgba(0, 212, 255, 0.18);
      overflow: hidden;
    }

    @media (max-width: 820px) {
      .login-container { grid-template-columns: 1fr; }
    }

    .login-hero {
      padding: 32px 28px;
      background: linear-gradient(155deg, #071f46 0%, #041026 65%, #190a28 100%);
      border-right: 1px solid rgba(0, 212, 255, 0.25);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .login-form-pane {
      padding: 32px 28px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .quick-role-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 10px;
    }

    .quick-role-card {
      padding: 8px 10px;
      border-radius: 6px;
      background: rgba(12, 42, 92, 0.65);
      border: 1px solid rgba(92, 139, 192, 0.45);
      cursor: pointer;
      text-align: left;
      color: #f1f5f9;
      transition: all 0.15s;
    }
    .quick-role-card:hover {
      border-color: #00d4ff;
      background: rgba(16, 58, 124, 0.9);
      transform: translateY(-1px);
    }
    .quick-role-card strong {
      display: block;
      font-size: 12px;
      color: #67e8f9;
    }
    .quick-role-card span {
      font-size: 11px;
      color: #cbd5e1;
    }

    /* ADMIN SHELL LAYOUT */
    .admin-shell {
      display: grid;
      grid-template-columns: 245px 1fr;
      min-height: calc(100vh - 56px);
    }

    @media (max-width: 960px) {
      .admin-shell { grid-template-columns: 1fr; }
    }

    .admin-sidebar {
      background: rgba(4, 14, 33, 0.95);
      border-right: 1px solid rgba(0, 212, 255, 0.28);
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .nav-section-title {
      font-size: 10.5px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #64748b;
      padding: 10px 10px 4px;
    }

    .nav-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 10px 12px;
      border-radius: 7px;
      background: transparent;
      border: 1px solid transparent;
      color: #cbd5e1;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
      transition: all 0.15s;
    }
    .nav-btn:hover { background: rgba(15, 45, 94, 0.65); color: #fff; }
    .nav-btn.active {
      background: linear-gradient(90deg, rgba(2, 132, 199, 0.35) 0%, rgba(15, 45, 94, 0.85) 100%);
      border-color: #00d4ff;
      color: #fff;
      box-shadow: inset 3px 0 0 #00d4ff;
    }

    .admin-main { padding: 20px 24px 48px; overflow-y: auto; }

    /* CARDS & PANELS */
    .panel {
      background: rgba(8, 28, 62, 0.85);
      border: 1px solid rgba(92, 139, 192, 0.42);
      border-radius: 10px;
      padding: 18px;
      margin-bottom: 18px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.35);
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 12px;
      margin-bottom: 14px;
      border-bottom: 1px solid rgba(92, 139, 192, 0.3);
      flex-wrap: wrap;
    }

    .panel-title {
      font-size: 16px;
      font-weight: 800;
      color: #f8fafc;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(185px, 1fr));
      gap: 14px;
      margin-bottom: 18px;
    }

    .stat-card {
      background: linear-gradient(145deg, rgba(12, 42, 92, 0.9) 0%, rgba(7, 23, 52, 0.95) 100%);
      border: 1px solid rgba(0, 212, 255, 0.35);
      border-radius: 10px;
      padding: 15px 16px;
    }
    .stat-card .stat-label { font-size: 11.5px; font-weight: 700; text-transform: uppercase; color: #93c5fd; }
    .stat-card .stat-value { font-size: 28px; font-weight: 900; color: #fff; margin: 4px 0; font-family: var(--font-mono); }
    .stat-card .stat-sub { font-size: 11.5px; color: #94a3b8; }

    /* TABLES */
    .table-wrap { overflow-x: auto; }
    table.data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    table.data-table th {
      background: rgba(4, 15, 35, 0.9);
      color: #7dd3fc;
      text-align: left;
      padding: 10px 12px;
      font-size: 11.5px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 2px solid rgba(0, 212, 255, 0.35);
    }
    table.data-table td {
      padding: 10px 12px;
      border-bottom: 1px solid rgba(92, 139, 192, 0.22);
      vertical-align: middle;
    }
    table.data-table tr:hover td { background: rgba(18, 57, 118, 0.45); }

    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .badge-published { background: rgba(16, 185, 129, 0.22); color: #6ee7b7; border: 1px solid #10b981; }
    .badge-ready { background: rgba(2, 132, 199, 0.25); color: #7dd3fc; border: 1px solid #38bdf8; }
    .badge-draft { background: rgba(245, 158, 11, 0.22); color: #fde68a; border: 1px solid #f59e0b; }
    .badge-archived { background: rgba(100, 116, 139, 0.25); color: #cbd5e1; border: 1px solid #64748b; }

    /* ============================================================================
       AUTHENTIC VTV3 OLYMPIA BROADCAST GRAPHICS (MATCHING THE 5 UPLOADED IMAGES)
       ============================================================================ */
    .vtv-stage-wrapper {
      background: radial-gradient(circle at 50% 25%, #0e387a 0%, #061b40 55%, #030c1e 100%);
      border: 2px solid #38bdf8;
      border-radius: 12px;
      padding: 20px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.75), inset 0 0 60px rgba(0, 212, 255, 0.12);
    }
    .vtv-stage-wrapper::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(0, 212, 255, 0.16) 1.5px, transparent 1.5px);
      background-size: 14px 14px;
      pointer-events: none;
      opacity: 0.45;
    }
    .vtv-stage-inner { position: relative; z-index: 2; }

    .vtv-kickoff-layout {
      display: grid;
      grid-template-columns: 1fr 290px;
      gap: 14px;
      align-items: stretch;
      margin-top: 12px;
    }
    @media (max-width: 820px) { .vtv-kickoff-layout { grid-template-columns: 1fr; } }

    .vtv-question-bevel-box {
      background: linear-gradient(180deg, #0c2b59 0%, #071a3b 48%, #09234c 100%);
      border: 2.5px solid #60a5fa;
      box-shadow: inset 0 0 24px rgba(0, 212, 255, 0.25), 0 8px 24px rgba(0, 0, 0, 0.65);
      clip-path: polygon(0 0, calc(100% - 22px) 0, 100% 22px, 100% 100%, 16px 100%, 0 calc(100% - 16px));
      padding: 22px 26px;
      min-height: 175px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    .vtv-question-text {
      font-size: 20px;
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
      line-height: 1.45;
    }

    .vtv-contestant-stack {
      display: flex;
      flex-direction: column;
      gap: 7px;
      justify-content: center;
    }

    .vtv-score-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 18px 10px 14px;
      background: linear-gradient(90deg, #071936 0%, #0d2b59 85%, #123970 100%);
      border: 1.5px solid rgba(96, 165, 250, 0.55);
      clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 0 100%);
      color: #ffffff;
      font-weight: 800;
      font-size: 16px;
      position: relative;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .vtv-score-row.common-mode::after {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      width: 18px;
      height: 18px;
      background: #00d4ff;
      clip-path: polygon(0 0, 100% 0, 100% 100%);
    }

    .vtv-score-row.active-turn {
      background: linear-gradient(90deg, #9e0b37 0%, #d4144c 65%, #e61955 100%);
      border-color: #fda4af;
      box-shadow: 0 0 18px rgba(212, 20, 76, 0.7);
      transform: translateX(-4px);
    }

    .vtv-score-row.buzzer-winner {
      background: linear-gradient(90deg, #b45309 0%, #d97706 65%, #f59e0b 100%);
      border-color: #fef08a;
      box-shadow: 0 0 22px rgba(251, 191, 36, 0.85);
      transform: scale(1.03);
    }

    .vtv-score-row .c-points {
      font-size: 20px;
      font-weight: 900;
      font-family: var(--font-mono);
    }

    /* OBSTACLE ROUND */
    .vtv-obstacle-grid {
      display: grid;
      grid-template-columns: 1fr 1.15fr;
      gap: 16px;
      margin-bottom: 14px;
    }
    @media (max-width: 860px) { .vtv-obstacle-grid { grid-template-columns: 1fr; } }

    .vtv-obstacle-image-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 10;
      background: #041022;
      border: 2.5px solid #38bdf8;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.65);
    }
    .vtv-obstacle-image-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .vtv-obstacle-cover-layer {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
    }
    .vtv-obs-quadrant {
      background: linear-gradient(135deg, rgba(8, 32, 72, 0.97) 0%, rgba(14, 53, 115, 0.96) 100%);
      border: 1.5px solid #00d4ff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 900;
      color: #67e8f9;
      transition: all 0.55s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .vtv-obs-quadrant.revealed {
      opacity: 0;
      transform: scale(0.75);
      pointer-events: none;
    }
    .vtv-obs-center-tile {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 38%;
      height: 38%;
      background: linear-gradient(135deg, #0d3b7a 0%, #061d42 100%);
      border: 2.5px solid #fbbf24;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      color: #fde047;
      z-index: 4;
      transition: all 0.55s ease;
    }
    .vtv-obs-center-tile.revealed {
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.5);
      pointer-events: none;
    }

    .vtv-obstacle-rows-board {
      background: linear-gradient(180deg, #07214a 0%, #051636 100%);
      border: 2px solid #00d4ff;
      border-radius: 6px;
      padding: 0 18px 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .vtv-cnv-header-banner {
      background: linear-gradient(180deg, #00c6ff 0%, #0088cc 100%);
      color: #ffffff;
      font-weight: 900;
      font-size: 16px;
      text-align: center;
      padding: 8px 24px;
      margin: 0 auto 14px;
      width: fit-content;
      min-width: 68%;
      clip-path: polygon(0 0, 100% 0, calc(100% - 16px) 100%, 16px 100%);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      box-shadow: 0 4px 14px rgba(0, 198, 255, 0.45);
    }
    .vtv-hn-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 7px 8px;
      border-radius: 8px;
      transition: background 0.2s;
    }
    .vtv-hn-row.selected-row {
      background: rgba(0, 212, 255, 0.14);
      box-shadow: inset 0 0 12px rgba(0, 212, 255, 0.35);
    }
    .vtv-hn-bubbles { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .vtv-letter-sphere {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 900;
      color: #021024;
      background: radial-gradient(circle at 32% 28%, #bbf7ff 0%, #38bdf8 38%, #0284c7 78%, #0c4a6e 100%);
      border: 2.5px solid #e0f2fe;
      box-shadow: inset 0 2px 5px rgba(255, 255, 255, 0.8), 0 3px 8px rgba(0, 0, 0, 0.6);
      text-transform: uppercase;
    }
    .vtv-letter-sphere.unrevealed {
      background: radial-gradient(circle at 32% 28%, #475569 0%, #1e293b 65%, #0f172a 100%);
      border-color: #64748b;
      color: transparent;
    }
    .vtv-hn-number-badge {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: linear-gradient(180deg, #103770 0%, #081e42 100%);
      border: 1.5px solid #38bdf8;
      color: #ffffff;
      font-weight: 900;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      cursor: pointer;
    }
    .vtv-hn-number-badge.active {
      background: linear-gradient(180deg, #d4144c 0%, #9e0b37 100%);
      border-color: #fda4af;
    }

    /* ACCELERATION ROUND */
    .vtv-accel-reveal-stage {
      background: linear-gradient(135deg, #0062bd 0%, #00397a 60%, #002352 100%);
      border: 2px solid #38bdf8;
      border-radius: 10px;
      padding: 26px 32px;
      position: relative;
      overflow: hidden;
    }
    .vtv-accel-timeline-list {
      position: relative;
      padding-left: 64px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      max-width: 720px;
    }
    .vtv-accel-timeline-list::before {
      content: "";
      position: absolute;
      left: 16px;
      top: 0;
      bottom: 12px;
      width: 5px;
      background: linear-gradient(180deg, #00e5ff 0%, #0284c7 100%);
      border-radius: 4px;
      box-shadow: 0 0 12px rgba(0, 229, 255, 0.7);
    }
    .vtv-accel-item { position: relative; display: flex; flex-direction: column; }
    .vtv-accel-node {
      position: absolute;
      left: -57px;
      top: 52%;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #00d4ff;
      border: 3px solid #7dd3fc;
      box-shadow: 0 0 12px #00e5ff;
    }
    .vtv-accel-connector {
      position: absolute;
      left: -33px;
      top: 58%;
      width: 30px;
      border-top: 3px dotted #ffffff;
    }
    .vtv-accel-name-tab {
      background: linear-gradient(90deg, #073878 0%, #00a8e8 85%, #00d4ff 100%);
      color: #ffffff;
      font-weight: 800;
      font-size: 15px;
      padding: 4px 22px 4px 14px;
      width: fit-content;
      min-width: 175px;
      clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 100%, 0 100%);
      border-top: 1px solid #7dd3fc;
    }
    .vtv-accel-answer-bar {
      background: linear-gradient(90deg, #051636 0%, #0a295e 65%, #0c357a 100%);
      border: 1.5px solid #38bdf8;
      padding: 12px 24px 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 18px, 100% 100%, 14px 100%, 0 calc(100% - 14px));
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.45);
    }
    .vtv-accel-answer-bar.correct-ans {
      border-color: #34d399;
      box-shadow: 0 0 18px rgba(16, 185, 129, 0.45);
    }
    .vtv-accel-ans-text {
      font-size: 26px;
      font-weight: 900;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }
    .vtv-accel-time-text {
      font-size: 26px;
      font-weight: 900;
      color: #ffffff;
      font-family: var(--font-mono);
    }

    /* FINISH ROUND */
    .vtv-finish-lower-third {
      position: relative;
      background: linear-gradient(180deg, #08234f 0%, #051636 100%);
      border: 2.5px solid #38bdf8;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 12px 34px rgba(0, 0, 0, 0.75);
      margin-top: 14px;
    }
    .vtv-finish-top-strip {
      display: flex;
      align-items: stretch;
      background: linear-gradient(90deg, #061b3d 0%, #0b2e66 100%);
      border-bottom: 2px solid #38bdf8;
      font-size: 15px;
      font-weight: 800;
      overflow-x: auto;
    }
    .vtv-finish-contestant-tab {
      padding: 8px 20px;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    .vtv-finish-contestant-tab.active-finisher {
      background: linear-gradient(90deg, #092c66 0%, #0066ff 100%);
      color: #ffffff;
      clip-path: polygon(0 0, 100% 0, calc(100% - 12px) 100%, 0 100%);
      padding-right: 28px;
      border-right: 2px solid #7dd3fc;
    }
    .vtv-finish-body-grid {
      display: grid;
      grid-template-columns: 1fr 165px;
      min-height: 155px;
    }
    @media (max-width: 720px) { .vtv-finish-body-grid { grid-template-columns: 1fr; } }
    .vtv-finish-question-area {
      padding: 20px 26px;
      font-size: 19px;
      font-weight: 700;
      color: #ffffff;
      display: flex;
      align-items: center;
      line-height: 1.45;
    }
    .vtv-finish-package-box {
      background: linear-gradient(160deg, #003785 0%, #05183c 100%);
      border-left: 3px solid #cbd5e1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 16px 12px 10px;
    }
    .vtv-finish-current-pts {
      font-size: 52px;
      font-weight: 900;
      color: #ffffff;
      line-height: 1;
    }
    .vtv-finish-pkg-strip {
      width: 100%;
      background: rgba(3, 11, 26, 0.85);
      padding: 6px 8px;
      text-align: center;
      font-size: 15px;
      font-weight: 900;
      border-top: 1px solid rgba(96, 165, 250, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .vtv-finish-pkg-strip span.active-q-pt {
      background: #be123c;
      color: #fff;
      padding: 2px 7px;
      border-radius: 3px;
    }

    .star-of-hope-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 999px;
      background: linear-gradient(90deg, #f59e0b 0%, #eab308 100%);
      color: #041022;
      font-weight: 900;
      font-size: 12.5px;
      box-shadow: 0 0 18px rgba(251, 191, 36, 0.85);
      animation: starPulse 1.1s infinite alternate;
    }
    @keyframes starPulse {
      from { transform: scale(1); }
      to { transform: scale(1.06); }
    }

    .olympia-timer-ring {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 78px;
      height: 46px;
      padding: 0 14px;
      border-radius: 8px;
      background: linear-gradient(180deg, #041022 0%, #09224a 100%);
      border: 2px solid #00d4ff;
      font-family: var(--font-mono);
      font-size: 24px;
      font-weight: 900;
      color: #67e8f9;
      box-shadow: 0 0 15px rgba(0, 212, 255, 0.35);
    }
    .olympia-timer-ring.urgent {
      border-color: #f43f5e;
      color: #fda4af;
      background: linear-gradient(180deg, #4c0519 0%, #881337 100%);
      animation: timerUrgentPulse 0.45s infinite alternate;
    }
    @keyframes timerUrgentPulse {
      from { transform: scale(1); }
      to { transform: scale(1.06); }
    }

    .stage-effect-banner {
      margin-top: 12px;
      padding: 12px 18px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      animation: effectPopIn 0.32s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .stage-effect-banner.effect-correct {
      background: linear-gradient(90deg, rgba(5, 150, 105, 0.9) 0%, rgba(16, 185, 129, 0.75) 100%);
      border: 2px solid #6ee7b7;
      color: #fff;
    }
    .stage-effect-banner.effect-wrong {
      background: linear-gradient(90deg, rgba(185, 28, 28, 0.9) 0%, rgba(239, 68, 68, 0.75) 100%);
      border: 2px solid #fca5a5;
      color: #fff;
    }
    .stage-effect-banner.effect-buzzer {
      background: linear-gradient(90deg, rgba(180, 83, 9, 0.92) 0%, rgba(245, 158, 11, 0.8) 100%);
      border: 2px solid #fde047;
      color: #fff;
    }
    .stage-effect-banner.effect-info {
      background: linear-gradient(90deg, rgba(2, 132, 199, 0.9) 0%, rgba(14, 165, 233, 0.75) 100%);
      border: 2px solid #7dd3fc;
      color: #fff;
    }
    @keyframes effectPopIn {
      from { opacity: 0; transform: translateY(8px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .score-float-badge {
      display: inline-block;
      margin-left: 8px;
      padding: 2px 7px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 900;
    }
    .score-float-badge.plus { background: #10b981; color: #022c22; }
    .score-float-badge.minus { background: #ef4444; color: #fff; }

    .contestant-terminal { max-width: 920px; margin: 22px auto; padding: 0 16px 40px; }
    .giant-buzzer-btn {
      width: 100%;
      padding: 22px;
      border-radius: 12px;
      font-size: 22px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      border: 3px solid #fde047;
      background: radial-gradient(circle at 50% 30%, #f43f5e 0%, #be123c 65%, #881337 100%);
      color: #fff;
      box-shadow: 0 8px 30px rgba(225, 29, 72, 0.65);
    }
    .giant-buzzer-btn:disabled {
      background: #1e293b;
      border-color: #475569;
      color: #64748b;
      box-shadow: none;
      cursor: not-allowed;
    }

    .reference-gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 14px;
    }
    .ref-card {
      background: rgba(4, 15, 35, 0.9);
      border: 1px solid rgba(0, 212, 255, 0.35);
      border-radius: 8px;
      overflow: hidden;
    }
    .ref-card img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      display: block;
      border-bottom: 1px solid rgba(0, 212, 255, 0.25);
    }
    .ref-card-body { padding: 10px 12px; font-size: 12px; }
  </style>
</head>

    function simpleHash(str) {
      let h1 = 0xdeadbeef ^ str.length;
      let h2 = 0x41c6ce57 ^ str.length;
      for (let i = 0, ch; i < str.length; i++) {
        ch = str.charCodeAt(i);
        h1 = Math.imul(h1 ^ ch, 2654435761);
        h2 = Math.imul(h2 ^ ch, 1597334677);
      }
      h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
      h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
      return "sha256_sim_" + (h2 >>> 0).toString(16).padStart(8, '0') + (h1 >>> 0).toString(16).padStart(8, '0');
    }

    function normalizeAnswer(raw) {
      if (raw === null || raw === undefined) return "";
      return String(raw).trim().replace(/\s+/g, " ").toUpperCase();
    }

    function checkAnswerMatch(submittedRaw, officialAnswer, acceptedVariants = []) {
      const sub = normalizeAnswer(submittedRaw);
      if (!sub) return false;
      const targets = [officialAnswer, ...(acceptedVariants || [])].map(normalizeAnswer).filter(Boolean);
      return targets.includes(sub);
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function formatTimeSec(ms) {
      const sec = Math.max(0, ms / 1000);
      return sec.toFixed(1) + "s";
    }

    const OlympiaAudio = {
      ctx: null,
      init() {
        if (!this.ctx && (window.AudioContext || window.webkitAudioContext)) {
          try {
            const Ctx = window.AudioContext || window.webkitAudioContext;
            this.ctx = new Ctx();
          } catch (e) {
            this.ctx = null;
          }
        }
        if (this.ctx && this.ctx.state === "suspended") {
          this.ctx.resume().catch(() => {});
        }
      },
      play(eventKey, config = { enabled: true, volume: 0.75 }) {
        if (!config || !config.enabled) return;
        this.init();
        if (!this.ctx) return;
        const vol = Math.max(0.05, Math.min(1, Number(config.volume ?? 0.75)));
        const now = this.ctx.currentTime;

        const playTone = (freq, startOffset, duration, type = "sine", gainMult = 0.25) => {
          try {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, now + startOffset);
            gain.gain.setValueAtTime(0.001, now + startOffset);
            gain.gain.exponentialRampToValueAtTime(vol * gainMult, now + startOffset + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, now + startOffset + duration);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + startOffset);
            osc.stop(now + startOffset + duration + 0.02);
          } catch (e) {}
        };

        switch (eventKey) {
          case "start_round":
            playTone(392, 0.0, 0.18, "triangle", 0.3);

        try {

              sessionStorage.removeItem(SESSION_KEY);

            }

        } catch (e) {}

        if (window.BroadcastChannel) {
          try {
            this.bc = new BroadcastChannel("olympia_arena_realtime_v2");
            this.bc.onmessage = (ev) => {
              if (ev.data && ev.data.type === "STATE_SYNC") {
                this.master = ev.data.payload;
                this.applyReducedMotionClass();
                this.render();
              } else if (ev.data && ev.data.type === "AUDIO_CUE") {
                OlympiaAudio.play(ev.data.soundKey, this.master.audioConfig);
              }
            };
          } catch (e) {}
        }

        window.addEventListener("storage", (ev) => {
          if (ev.key === STORAGE_KEY && ev.newValue) {
            try {
              this.master = JSON.parse(ev.newValue);
              this.applyReducedMotionClass();
              this.render();
            } catch (e) {}
          }
        });

        this.timerInterval = setInterval(() => {
          this.tickTimer();
        }, 100);

        window.addEventListener("keydown", (ev) => {
          if (!this.session || this.session.role !== "ADMIN") return;
          const tag = (ev.target && ev.target.tagName) ? ev.target.tagName.toUpperCase() : "";
          if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
          if (this.adminTab !== "LIVE_CONTROL") return;

          if (ev.code === "Space") {
            ev.preventDefault();
            this.adminStartOrToggleTimer();
          } else if (ev.key === "r" || ev.key === "R") {
            ev.preventDefault();
            this.adminRevealCurrentAnswer();

      createSession(user, roomCode = "OLP-2026-A", remember = true) {
        if (this.session && (this.session.userId !== user.id || this.session.role !== user.role)) {
          alert("Khóa vai trò bảo mật: Bạn đã đăng nhập với vai trò " + this.session.role + " (" + this.session.fullName + "). Không thể chuyển đổi sang vai trò hoặc tài khoản khác khi đang trong phiên! Vui lòng Đăng xuất trước nếu muốn đăng nhập tài khoản khác.");

        }
        const sess = {
          userId: user.id,
          username: user.username,

          seat: user.seat || null,
          fullName: user.fullName,
          school: user.school,

          roomCode: roomCode || user.assignedRoomCode || "OLP-2026-A",
          loginTime: Date.now(),

        };
        this.session = sess;

      login(username, password, roomCode, remember) {
        const uName = String(username || "").trim().toLowerCase();
        const user = this.master.users.find(u => u.username.toLowerCase() === uName);
        if (!user) {
          return { ok: false, error: "Tài khoản không tồn tại trong hệ thống OLYMPIA ARENA." };
        }
        if (user.status === "LOCKED") {
          return { ok: false, error: "Tài khoản này đã bị khóa do nhập sai mật khẩu quá số lần quy định hoặc bị Admin tạm ngưng." };
        }
        const hashed = simpleHash(String(password || ""));
        if (Array.isArray(user.revokedPasswordHashes) && user.revokedPasswordHashes.includes(hashed)) {
          return { ok: false, error: "Mật khẩu cũ này đã bị vô hiệu hóa! Vui lòng nhập mật khẩu mới." };
        }
        if (user.passwordHash !== hashed) {
          user.failedAttempts = (user.failedAttempts || 0) + 1;
          if (user.failedAttempts >= 5 && user.role !== "ADMIN") {
            user.status = "LOCKED";
          }
          this.persistMaster(true);
          return { ok: false, error: "Mật khẩu không chính xác. Vui lòng kiểm tra lại." };
        }
        user.failedAttempts = 0;
        const targetRoom = this.master.rooms.find(r => r.code === (roomCode || user.assignedRoomCode)) || this.master.rooms[0];
        this.createSession(user, targetRoom.code, remember);
        this.logAudit(user.username, user.role, "USER_LOGIN", `Đăng nhập thành công vào phòng ${targetRoom.code}`, targetRoom);
        this.persistMaster(true);
        return { ok: true };
      },

      logout() {
        if (this.session) {
          this.logAudit(this.session.username, this.session.role, "USER_LOGOUT", "Đăng xuất khỏi phiên làm việc");
        }
        this.session = null;
        try {
          sessionStorage.removeItem(SESSION_KEY);
          localStorage.removeItem(SESSION_KEY);
        } catch (e) {}
        this.persistMaster(true);
      },


      adminChangeNewPassword(oldPass, newPass, confirmPass) {
        if (!this.requireAdmin()) return false;
        const adminUser = this.master.users.find(u => u.role === "ADMIN");
        if (!adminUser) return false;

        const oldHash = simpleHash(String(oldPass || ""));
        if (adminUser.passwordHash !== oldHash) {
          alert("Mật khẩu Admin hiện tại không chính xác!");
          return false;
        }
        const cleanedNew = String(newPass || "").trim();
        if (cleanedNew.length < 6) {
          alert("Mật khẩu Admin mới phải có ít nhất 6 ký tự!");
          return false;
        }
        if (cleanedNew !== String(confirmPass || "").trim()) {
          alert("Xác nhận mật khẩu mới không khớp!");
          return false;
        }
        const newHash = simpleHash(cleanedNew);
        if (!Array.isArray(adminUser.revokedPasswordHashes)) {
          adminUser.revokedPasswordHashes = [];
        }
        if (adminUser.passwordHash === newHash || adminUser.revokedPasswordHashes.includes(newHash)) {
          alert("Không được sử dụng lại mật khẩu Admin cũ! Vui lòng chọn một mật khẩu hoàn toàn mới.");
          return false;
        }

        // Move current password hash to revokedPasswordHashes so old password is never accepted again
        adminUser.revokedPasswordHashes.push(adminUser.passwordHash);
        adminUser.passwordHash = newHash;
        this.logAudit(this.session.username, "ADMIN", "ADMIN_PASSWORD_UPDATED", "Đã thiết lập mật khẩu Admin mới và vô hiệu hóa mật khẩu cũ");
        this.persistMaster(true);
        alert("Đã cập nhật mật khẩu Admin mới thành công! Mật khẩu cũ đã bị vô hiệu hóa hoàn toàn.");
        return true;
      },

          alert("Từ chối truy cập (403 Forbidden): Chỉ tài khoản ADMIN mới có quyền thực hiện thao tác điều khiển này.");

      startServerTimer(room, durationSec, label) {
        const now = Date.now();
        const durMs = Math.max(1, Number(durationSec)) * 1000;
        room.timer = {
          timerId: "tm_" + now,
          status: "RUNNING",
          durationMs: durMs,
          startedAtMs: now,
          deadlineMs: now + durMs,
          remainingMsWhenPaused: durMs,
          contextLabel: label || "Đếm ngược"
        };
        this.broadcastAudio("start_round");
      },

      pauseServerTimer(room) {
        if (room.timer.status !== "RUNNING") return;
        const rem = Math.max(0, room.timer.deadlineMs - Date.now());
        room.timer.status = "PAUSED";
        room.timer.remainingMsWhenPaused = rem;
        this.logAudit(this.session?.username || "admin", "ADMIN", "TIMER_PAUSE", `Tạm dừng đồng hồ ở ${formatTimeSec(rem)}`, room);
        this.persistMaster(true);
      },

      resumeServerTimer(room) {
        if (room.timer.status !== "PAUSED") return;
        const now = Date.now();
        room.timer.status = "RUNNING";
        room.timer.deadlineMs = now + room.timer.remainingMsWhenPaused;
        this.logAudit(this.session?.username || "admin", "ADMIN", "TIMER_RESUME", `Tiếp tục đồng hồ (${formatTimeSec(room.timer.remainingMsWhenPaused)})`, room);
        this.persistMaster(true);
      },

      stopServerTimer(room, expired = false) {
        room.timer.status = expired ? "EXPIRED" : "IDLE";
        room.timer.remainingMsWhenPaused = 0;
        if (expired) {
          this.broadcastAudio("timer_expire");
        }
      },

      getTimerRemainingMs(room) {
        if (!room || !room.timer) return 0;
        if (room.timer.status === "RUNNING") {
          return Math.max(0, room.timer.deadlineMs - Date.now());
        }
        if (room.timer.status === "PAUSED") {
          return Math.max(0, room.timer.remainingMsWhenPaused);
        }
        return 0;
      },

      tickTimer() {
        const room = this.getActiveRoom();
        if (!room || room.timer.status !== "RUNNING") return;
        const rem = room.timer.deadlineMs - Date.now();

        if (rem <= 0) {
          this.stopServerTimer(room, true);
          if (room.currentRound === "KICKOFF_PRIVATE" && room.kickoffPrivateState.questionStatus === "ACCEPTING_ANSWERS") {
            room.kickoffPrivateState.questionStatus = "LOCKED";
          } else if (room.currentRound === "KICKOFF_COMMON" && room.kickoffCommonState.questionStatus === "ACCEPTING_ANSWERS") {
            room.kickoffCommonState.questionStatus = "LOCKED";
            room.kickoffCommonState.buzzerState = "LOCKED";
          } else if (room.currentRound === "OBSTACLE" && room.obstacleState.questionStatus === "ACCEPTING_ANSWERS") {
            room.obstacleState.questionStatus = "LOCKED";
          } else if (room.currentRound === "ACCELERATION" && room.accelerationState.questionStatus === "ACCEPTING_ANSWERS") {
            room.accelerationState.questionStatus = "LOCKED";
          } else if (room.currentRound === "FINISH") {
            if (room.finishState.questionStatus === "ACCEPTING_ANSWERS") {
              room.finishState.questionStatus = "LOCKED";
            } else if (room.finishState.questionStatus === "STEAL_WINDOW") {
              room.finishState.questionStatus = "LOCKED";
              room.finishState.stealBuzzerState = "LOCKED";
            }
          }
          this.persistMaster(true);
          return;
        }

        const timerEls = document.querySelectorAll("[data-live-timer]");
        timerEls.forEach(el => {
          el.textContent = (rem / 1000).toFixed(1) + "s";
          if (rem <= 3000) {
            el.classList.add("urgent");
          } else {
            el.classList.remove("urgent");
          }
        });
      },

      applyScoreChange(room, contestantId, delta, reason, actionKey = null) {
        if (actionKey && room.processedActionIds.includes(actionKey)) {
          return false;
        }
        const c = room.contestants.find(x => x.id === contestantId);
        if (!c) return false;

        const before = c.score;
        const change = Number(delta) || 0;
        const after = before + change;
        c.score = after;
        c.roundScores[room.currentRound] = (c.roundScores[room.currentRound] || 0) + change;
        c.lastDelta = { value: change, time: Date.now() };

        if (actionKey) {
          room.processedActionIds.push(actionKey);
        }

        const ev = {
          id: "sc_" + Date.now() + "_" + Math.floor(Math.random() * 999),
          roomId: room.id,
          round: room.currentRound,
          contestantId: c.id,
          contestantName: c.name,
          before,
          change,
          after,
          reason,
          timestamp: new Date().toTimeString().slice(0, 8),
          actor: this.session ? this.session.username : "SYSTEM"
        };
        room.scoreEvents.unshift(ev);
        this.logAudit(ev.actor, "ADMIN", "SCORE_UPDATE", `${c.name}: ${before} -> ${after} (${change >= 0 ? '+' + change : change}) [${reason}]`, room);

        if (change > 0) {
          this.triggerStageEffect(room, "score_add", `CỘNG +${change} ĐIỂM — ${c.name.toUpperCase()}`, reason, c.id);
        } else if (change < 0) {
          this.triggerStageEffect(room, "score_deduct", `TRỪ ${change} ĐIỂM — ${c.name.toUpperCase()}`, reason, c.id);
        }
        return true;
      },

      triggerStageEffect(room, effectType, title, subtitle = "", contestantId = null) {
        const cfg = this.master.effectsConfig[effectType];
        if (!cfg || !cfg.enabled) return;
        room.activeEffectEvent = {
          id: "eff_" + Date.now(),
          type: effectType,
          style: cfg.selectedStyle,
          targetZone: cfg.targetZone,
          title,
          subtitle,
          contestantId,
          timestamp: Date.now()
        };
        if (cfg.soundKey) {
          this.broadcastAudio(cfg.soundKey);
        }
      },


      adminUpdateCurrentQuestionTime(newSeconds) {
        if (!this.requireAdmin()) return false;
        const sec = Math.max(1, Math.min(600, Math.round(Number(newSeconds) || 1)));
        const room = this.getActiveRoom();
        if (!room) return false;
        const round = room.currentRound;

        if (round === "KICKOFF_PRIVATE") {
          const q = this.getCurrentKickoffPrivateQuestion(room);
          if (q) q.timeSec = sec;
          room.examSnapshot.roundsConfig.kickoffPrivate.timeSec = sec;
        } else if (round === "KICKOFF_COMMON") {
          const q = this.getCurrentKickoffCommonQuestion(room);
          if (q) q.timeSec = sec;
          room.examSnapshot.roundsConfig.kickoffCommon.timeSec = sec;
        } else if (round === "OBSTACLE") {
          room.examSnapshot.obstacle.timePerRowSec = sec;
          room.examSnapshot.roundsConfig.obstacle.rowTimeSec = sec;
        } else if (round === "ACCELERATION") {
          const q = this.getCurrentAccelerationQuestion(room);
          if (q) q.timeSec = sec;
        } else if (round === "FINISH") {
          const q = this.getCurrentFinishQuestion(room);
          if (q) q.timeSec = sec;
        }

        // If timer is IDLE, also update its preview durationMs so the big stage clock immediately reflects the new seconds!
        if (room.timer.status !== "RUNNING") {
          room.timer.durationMs = sec * 1000;
          room.timer.remainingMsWhenPaused = sec * 1000;
        }

        // Also sync to the underlying exam in master.exams if matching id
        const masterExam = this.master.exams.find(e => e.id === room.examId);
        if (masterExam) {
          if (round === "KICKOFF_PRIVATE") {
            const curQ = this.getCurrentKickoffPrivateQuestion(room);
            const mq = masterExam.kickoffPrivate.find(x => x.id === curQ?.id);
            if (mq) mq.timeSec = sec;
            masterExam.roundsConfig.kickoffPrivate.timeSec = sec;
          } else if (round === "KICKOFF_COMMON") {
            const curQ = this.getCurrentKickoffCommonQuestion(room);
            const mq = masterExam.kickoffCommon.find(x => x.id === curQ?.id);
            if (mq) mq.timeSec = sec;
            masterExam.roundsConfig.kickoffCommon.timeSec = sec;
          } else if (round === "OBSTACLE") {
            masterExam.obstacle.timePerRowSec = sec;
            masterExam.roundsConfig.obstacle.rowTimeSec = sec;
          } else if (round === "ACCELERATION") {
            const curQ = this.getCurrentAccelerationQuestion(room);
            const mq = masterExam.acceleration.find(x => x.id === curQ?.id);
            if (mq) mq.timeSec = sec;
          } else if (round === "FINISH") {
            const curQ = this.getCurrentFinishQuestion(room);
            const mq = masterExam.finishQuestions.find(x => x.id === curQ?.id);
            if (mq) mq.timeSec = sec;
          }
        }

        this.logAudit(this.session.username, "ADMIN", "QUESTION_TIME_UPDATED", `Cập nhật thời gian trả lời vòng ${round} thành ${sec} giây`, room);
        this.persistMaster(true);
        return true;
      },

      adminUpdateBulkRoundTime(examId, roundKey, newSeconds) {
        if (!this.requireAdmin()) return false;
        const sec = Math.max(1, Math.min(600, Math.round(Number(newSeconds) || 1)));
        const ex = this.master.exams.find(e => e.id === examId);
        if (!ex) return false;

        if (roundKey === "KICKOFF_PRIVATE") {
          ex.roundsConfig.kickoffPrivate.timeSec = sec;
          ex.kickoffPrivate.forEach(q => { q.timeSec = sec; });
        } else if (roundKey === "KICKOFF_COMMON") {
          ex.roundsConfig.kickoffCommon.timeSec = sec;
          ex.kickoffCommon.forEach(q => { q.timeSec = sec; });
        } else if (roundKey === "OBSTACLE") {
          ex.obstacle.timePerRowSec = sec;
          ex.roundsConfig.obstacle.rowTimeSec = sec;
        } else if (roundKey === "FINISH_STEAL") {
          ex.roundsConfig.finish.stealWindowSec = sec;
        }

        // Also sync to active room snapshot if using this exam
        const room = this.getActiveRoom();
        if (room && room.examId === examId) {
          if (roundKey === "KICKOFF_PRIVATE") {
            room.examSnapshot.roundsConfig.kickoffPrivate.timeSec = sec;
            room.examSnapshot.kickoffPrivate.forEach(q => { q.timeSec = sec; });
          } else if (roundKey === "KICKOFF_COMMON") {
            room.examSnapshot.roundsConfig.kickoffCommon.timeSec = sec;
            room.examSnapshot.kickoffCommon.forEach(q => { q.timeSec = sec; });
          } else if (roundKey === "OBSTACLE") {
            room.examSnapshot.obstacle.timePerRowSec = sec;
            room.examSnapshot.roundsConfig.obstacle.rowTimeSec = sec;
          } else if (roundKey === "FINISH_STEAL") {
            room.examSnapshot.roundsConfig.finish.stealWindowSec = sec;
          }
          if (room.timer.status !== "RUNNING") {
            room.timer.durationMs = sec * 1000;
            room.timer.remainingMsWhenPaused = sec * 1000;
          }
        }

        ex.version += 1;
        this.logAudit(this.session.username, "ADMIN", "ROUND_TIME_BULK_UPDATED", `Đổi thời gian mặc định ${roundKey} của đề ${ex.code} thành ${sec}s`);
        this.persistMaster(true);
        return true;
      },


      finishCompetitionAndShowCeremony() {

        if (!room) return;
        this.stopServerTimer(room, false);
        room.status = "FINISHED";
        room.projectionScene = "WINNER_CEREMONY";
        const sorted = [...room.contestants].sort((a, b) => b.score - a.score);
        const champ = sorted[0];

          room,
          "winner_reveal",
          `CHUNG CUỘC: QUÁN QUÂN ${champ.name.toUpperCase()} (${champ.score} ĐIỂM)`,

        );

      restartCompetitionMatch(newExamId = null, skipConfirm = false) {
        const room = this.getActiveRoom();
        if (!room) return false;
        if (this.autoPlayTimer) {
          clearInterval(this.autoPlayTimer);
          this.autoPlayTimer = null;
        }

        const targetExam = (newExamId && this.master.exams.find(e => e.id === newExamId))
          || this.master.exams.find(e => e.id === room.examId)
          || this.master.exams[0];

        if (!skipConfirm) {
          const ok = confirm(
            `[XÁC NHẬN THI LẠI TỪ ĐẦU]\n\n` +
            `• Kết quả hiện tại của phòng ${room.code} sẽ được lưu tự động vào Lịch sử các lượt thi.\n` +
            `• Điểm số của cả 4 thí sinh sẽ đặt lại về 0.\n` +
            `• Toàn bộ 4 vòng thi (Khởi động riêng, Khởi động chung, VCNV, Tăng tốc, Về đích) sẽ mở lại từ đầu với đề "${targetExam.code}".\n\n` +
            `Bạn có muốn bắt đầu lượt thi lại ngay bây giờ không?`
          );
          if (!ok) return false;
        }

        // Archive current match result before resetting if any score events or points exist
        if (!Array.isArray(room.matchArchives)) room.matchArchives = [];
        const hasActivity = room.scoreEvents.length > 0 || room.contestants.some(c => c.score !== 0);
        if (hasActivity) {
          const sorted = [...room.contestants].sort((a, b) => b.score - a.score);
          room.matchArchives.unshift({
            archiveId: "arch_" + Date.now(),
            finishedAt: "2026-10-14 " + new Date().toTimeString().slice(0, 8),
            examCode: room.examCode,
            winnerName: sorted[0].name,
            winnerScore: sorted[0].score,
            standings: sorted.map((c, i) => ({
              rank: i + 1,
              name: c.name,
              school: c.school,
              totalScore: c.score,
              roundScores: { ...c.roundScores }
            })),
            totalEvents: room.scoreEvents.length
          });
        }

        const prevArchives = room.matchArchives;
        const prevCustomContestants = room.contestants.map(c => ({
          id: c.id,
          seat: c.seat,
          name: c.name,
          school: c.school,
          className: c.className
        }));

        // Re-create clean room state with fresh exam snapshot
        const freshRoom = createInitialRoom(room.id, room.code, room.name, targetExam);
        freshRoom.matchArchives = prevArchives;
        // Preserve custom contestant names/schools if edited
        freshRoom.contestants.forEach((fc, idx) => {
          if (prevCustomContestants[idx]) {
            fc.name = prevCustomContestants[idx].name;
            fc.school = prevCustomContestants[idx].school;
            fc.className = prevCustomContestants[idx].className;
          }
        });
        // Set Obstacle rows to CLOSED for a true fresh playthrough from scratch
        freshRoom.obstacleState.rowsStatus = ["CLOSED", "CLOSED", "CLOSED", "CLOSED"];
        freshRoom.obstacleState.quadrantsRevealed = [false, false, false, false];
        freshRoom.obstacleState.centerRevealed = false;
        freshRoom.obstacleState.keywordRevealed = false;
        // Set Acceleration submissions to empty for fresh playthrough
        freshRoom.accelerationState.questionIdx = 0;
        freshRoom.accelerationState.questionStatus = "PUBLISHED";
        freshRoom.accelerationState.submissions = [];

        const rIdx = this.master.rooms.findIndex(r => r.id === room.id);
        if (rIdx >= 0) {
          this.master.rooms[rIdx] = freshRoom;
        }

        this.logAudit(
          this.session?.username || "system",
          this.session?.role || "ADMIN",
          "MATCH_REPLAY_STARTED",
          `Bắt đầu thi lại từ đầu tại phòng ${freshRoom.code} với đề ${targetExam.code}`,
          freshRoom
        );
        this.triggerStageEffect(
          freshRoom,
          "round_transition",
          `BẮT ĐẦU LƯỢT THI LẠI MỚI — ĐỀ ${targetExam.code}`,
          "Điểm số và 4 vòng thi đã được làm mới hoàn toàn"
        );
        this.persistMaster(true);
        return true;
      },

      restartCurrentRoundOnly(skipConfirm = false) {
        const room = this.getActiveRoom();
        if (!room) return false;
        const round = room.currentRound;
        if (!skipConfirm) {
          if (!confirm(`Bạn có chắc chắn muốn THI LẠI RIÊNG vòng hiện tại (${round})? Điểm cộng/trừ trong vòng này sẽ được hoàn tác về đầu vòng và mở lại câu số 1 của vòng.`)) {
            return false;
          }
        }

        this.stopServerTimer(room, false);
        // Revert only current round score delta for each contestant
        room.contestants.forEach(c => {
          const roundDelta = c.roundScores[round] || 0;
          c.score -= roundDelta;
          c.roundScores[round] = 0;
          c.lastDelta = null;
          if (round === "OBSTACLE") c.cnvLocked = false;
        });

        // Clear processed action keys for this round
        const prefixMap = {
          KICKOFF_PRIVATE: "kp_",
          KICKOFF_COMMON: "kc_",
          OBSTACLE: "obs_",
          ACCELERATION: "acc_",
          FINISH: "fin_"
        };
        const pref = prefixMap[round] || "";
        if (pref) {
          room.processedActionIds = room.processedActionIds.filter(k => !k.startsWith(pref));
        }

        if (round === "KICKOFF_PRIVATE") {
          room.kickoffPrivateState = {
            activeContestantIdx: 0,
            questionIdxInTurn: 0,
            completedCountByContestant: [0, 0, 0, 0],
            questionStatus: "PUBLISHED",
            submittedAnswer: "",
            submittedAtMs: null,
            scoredProcessedKey: null
          };
        } else if (round === "KICKOFF_COMMON") {
          room.kickoffCommonState = {
            questionIdx: 0,
            mode: room.kickoffCommonState.mode || "BUZZER",
            questionStatus: "PUBLISHED",
            buzzerState: "CLOSED",
            buzzerWinnerId: null,
            buzzerEvents: [],
            answersByContestant: {},
            scoredProcessedKey: null
          };
        } else if (round === "OBSTACLE") {
          room.obstacleState = {
            selectedRowIdx: 0,
            questionStatus: "PUBLISHED",
            rowsStatus: ["CLOSED", "CLOSED", "CLOSED", "CLOSED"],
            quadrantsRevealed: [false, false, false, false],
            centerRevealed: false,
            keywordRevealed: false,
            rowAnswersByContestant: {},
            cnvBuzzerQueue: [],
            activeCnvSolverId: null
          };
        } else if (round === "ACCELERATION") {
          room.accelerationState = {
            questionIdx: 0,
            questionStatus: "PUBLISHED",
            questionStartTimestamp: Date.now(),
            submissions: [],
            scoredProcessedKey: null
          };
        } else if (round === "FINISH") {
          room.finishState = {
            activeContestantIdx: 0,
            selectedPackage: [20, 20, 20],
            currentQuestionSlot: 0,
            assignedQuestionIds: ["fin_20_1", "fin_20_2", "fin_20_3"],
            starOfHopeUsedInTurn: false,
            starOfHopeActiveOnCurrent: false,
            questionStatus: "PUBLISHED",
            primaryAnswer: "",
            stealBuzzerState: "CLOSED",
            stealWinnerId: null,
            stealAnswer: "",
            scoredProcessedKey: null
          };
        }

        room.projectionScene = "ROUND_STAGE";
        room.status = "LIVE";
        this.logAudit(this.session?.username || "admin", this.session?.role || "ADMIN", "ROUND_REPLAY", `Thi lại vòng ${round} tại phòng ${room.code}`, room);
        this.triggerStageEffect(room, "round_transition", `THI LẠI VÒNG: ${round}`, "Đã đặt lại điểm và câu hỏi của vòng hiện tại");
        this.persistMaster(true);
        return true;
      },


      isCurrentQuestionVisible(room) {
        if (!room) return false;
        const r = room.currentRound;
        let st = null;
        if (r === "KICKOFF_PRIVATE") st = room.kickoffPrivateState;
        else if (r === "KICKOFF_COMMON") st = room.kickoffCommonState;
        else if (r === "OBSTACLE") st = room.obstacleState;
        else if (r === "ACCELERATION") st = room.accelerationState;
        else if (r === "FINISH") st = room.finishState;
        if (!st) return false;
        if (st.questionVisible === true) return true;
        if (["ACCEPTING_ANSWERS", "STEAL_WINDOW", "LOCKED", "SCORED", "REVEALED"].includes(st.questionStatus)) {
          return true;
        }
        return false;
      },

      adminShowCurrentQuestion(visible = true) {
        if (!this.requireAdmin()) return false;
        const room = this.getActiveRoom();
        if (!room) return false;
        const r = room.currentRound;
        let st = null;
        if (r === "KICKOFF_PRIVATE") st = room.kickoffPrivateState;
        else if (r === "KICKOFF_COMMON") st = room.kickoffCommonState;
        else if (r === "OBSTACLE") st = room.obstacleState;
        else if (r === "ACCELERATION") st = room.accelerationState;
        else if (r === "FINISH") st = room.finishState;
        if (!st) return false;

        st.questionVisible = Boolean(visible);
        if (visible && st.questionStatus === "HIDDEN") {
          st.questionStatus = "PUBLISHED";
        } else if (!visible) {
          st.questionStatus = "HIDDEN";
          this.stopServerTimer(room, false);
        }
        this.logAudit(this.session.username, "ADMIN", visible ? "QUESTION_SHOWN" : "QUESTION_HIDDEN", `${visible ? "Hiển thị" : "Ẩn"} câu hỏi vòng ${r} trên màn hình`, room);
        this.persistMaster(true);
        return true;
      },

      kpRandomizeStartingContestant() {
        if (!this.requireAdmin()) return false;
        const room = this.getActiveRoom();
        const st = room.kickoffPrivateState;
        // Find contestants who haven't completed all 6 questions yet (or all 4 if all completed)
        let eligible = [0, 1, 2, 3].filter(idx => (st.completedCountByContestant[idx] || 0) < 6);
        if (eligible.length === 0) eligible = [0, 1, 2, 3];

        // Fisher-Yates shuffle for fair random turn order
        const shuffled = [...eligible];
        for (let i = shuffled.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          const tmp = shuffled[i];
          shuffled[i] = shuffled[j];
          shuffled[j] = tmp;
        }
        // Append any already-completed contestants at the end to keep a 4-element array
        [0, 1, 2, 3].forEach(idx => {
          if (!shuffled.includes(idx)) shuffled.push(idx);
        });

        st.turnOrder = shuffled;
        st.turnOrderRandomized = true;
        st.activeContestantIdx = shuffled[0];
        st.questionIdxInTurn = Math.min(5, st.completedCountByContestant[st.activeContestantIdx] || 0);
        st.questionVisible = false;
        st.questionStatus = "HIDDEN";
        st.submittedAnswer = "";
        st.submittedAtMs = null;
        this.stopServerTimer(room, false);

        const chosen = room.contestants[st.activeContestantIdx];
        const orderStr = shuffled.map((cIdx, pos) => `${pos + 1}. ${room.contestants[cIdx].name}`).join(" → ");
        this.triggerStageEffect(
          room,
          "buzzer_win",
          `🎲 RANDOM NGƯỜI KHỞI ĐỘNG TRƯỚC: ${chosen.name.toUpperCase()} (VỊ TRÍ SỐ ${chosen.seat})`,
          `Thứ tự lượt thi ngẫu nhiên: ${orderStr}`,
          chosen.id
        );
        this.logAudit(this.session.username, "ADMIN", "KP_RANDOMIZE_STARTER", `Random người khởi động trước: ${chosen.name}. Thứ tự: ${orderStr}`, room);
        this.persistMaster(true);
        return st.activeContestantIdx;
      },

      kpSwitchToNextInTurnOrder() {
        if (!this.requireAdmin()) return false;
        const room = this.getActiveRoom();
        const st = room.kickoffPrivateState;
        const order = Array.isArray(st.turnOrder) && st.turnOrder.length === 4 ? st.turnOrder : [0, 1, 2, 3];
        const curPos = order.indexOf(st.activeContestantIdx);
        const nextPos = (curPos + 1) % order.length;
        return this.kpSwitchContestant(order[nextPos], false);
      },

      getCurrentLiveQuestionObject(room) {
        if (!room) return null;
        const r = room.currentRound;
        if (r === "KICKOFF_PRIVATE") return this.getCurrentKickoffPrivateQuestion(room);
        if (r === "KICKOFF_COMMON") return this.getCurrentKickoffCommonQuestion(room);
        if (r === "OBSTACLE") {
          const idx = room.obstacleState.selectedRowIdx;
          return idx === 4 ? room.examSnapshot.obstacle.centerQuestion : room.examSnapshot.obstacle.rows[idx];
        }
        if (r === "ACCELERATION") return this.getCurrentAccelerationQuestion(room);
        if (r === "FINISH") return this.getCurrentFinishQuestion(room);
        return null;
      },

      adminAttachVideoToCurrentQuestion(videoUrlOrDataUri) {
        if (!this.requireAdmin()) return false;
        const room = this.getActiveRoom();
        const q = this.getCurrentLiveQuestionObject(room);
        if (!q) return false;
        q.videoUrl = String(videoUrlOrDataUri || "").trim();

        // Also sync to master exam
        const masterExam = this.master.exams.find(e => e.id === room.examId);
        if (masterExam) {
          const allLists = [
            masterExam.kickoffPrivate,
            masterExam.kickoffCommon,
            masterExam.obstacle?.rows,
            [masterExam.obstacle?.centerQuestion],
            masterExam.acceleration,
            masterExam.finishQuestions
          ];
          allLists.forEach(list => {
            if (Array.isArray(list)) {
              const found = list.find(x => x && x.id === q.id);
              if (found) found.videoUrl = q.videoUrl;
            }
          });
        }
        this.logAudit(this.session.username, "ADMIN", "QUESTION_VIDEO_ATTACHED", q.videoUrl ? `Gắn video cho câu hỏi ${q.id}` : `Gỡ video khỏi câu hỏi ${q.id}`, room);
        this.persistMaster(true);
        return true;
      },

      adminHandleVideoFileUpload(fileInputEl, examId = null, roundView = null, qIdx = null) {
        if (!this.requireAdmin()) return;
        const file = fileInputEl && fileInputEl.files && fileInputEl.files[0];
        if (!file) return;
        if (file.size > 25 * 1024 * 1024) {
          alert("Vui lòng chọn tệp video ngắn có dung lượng dưới 25MB để đồng bộ mượt mà!");
          return;
        }
        const reader = new FileReader();
        reader.onload = (ev) => {
          const dataUri = ev.target.result;
          if (examId !== null && roundView !== null && qIdx !== null) {
            this.updateQuestionField(examId, roundView, qIdx, "videoUrl", dataUri);
          } else {
            this.adminAttachVideoToCurrentQuestion(dataUri);
          }
        };
        reader.readAsDataURL(file);
      },

      getCurrentKickoffPrivateQuestion(room) {
        const st = room.kickoffPrivateState;
        const list = room.examSnapshot.kickoffPrivate.filter(q => q.contestantIndex === st.activeContestantIdx);
        return list[st.questionIdxInTurn] || list[0];
      },

      kpStartTimer3s() {
        if (!this.requireAdmin()) return;
        const room = this.getActiveRoom();
        const st = room.kickoffPrivateState;
        const q = this.getCurrentKickoffPrivateQuestion(room);
        const cfg = room.examSnapshot.roundsConfig.kickoffPrivate;
        st.questionVisible = true;
        st.questionStatus = "ACCEPTING_ANSWERS";
        st.submittedAnswer = "";
        st.submittedAtMs = null;
        this.startServerTimer(room, q?.timeSec || cfg.timeSec || 3, `Khởi động riêng - Câu ${st.questionIdxInTurn + 1}/6`);
        this.persistMaster(true);
      },

      kpSubmitAnswer(contestantId, answerText) {
        const room = this.getActiveRoom();
        const st = room.kickoffPrivateState;
        const activeC = room.contestants[st.activeContestantIdx];
        if (!activeC || activeC.id !== contestantId) {
          alert("Chỉ thí sinh đang trong lượt Khởi động riêng mới được gửi đáp án!");
          return false;
        }
        if (st.questionStatus !== "ACCEPTING_ANSWERS" || room.timer.status !== "RUNNING" || Date.now() > room.timer.deadlineMs) {
          alert("Đã hết thời gian 3 giây hoặc câu hỏi chưa mở trả lời!");
          return false;
        }
        st.submittedAnswer = String(answerText || "").trim();
        st.submittedAtMs = Date.now();
        st.questionStatus = "LOCKED";
        this.stopServerTimer(room, false);
        this.persistMaster(true);
        return true;
      },


      kpAutoGradeSubmitted() {
        if (!this.requireAdmin()) return;
        const room = this.getActiveRoom();
        const st = room.kickoffPrivateState;
        const q = this.getCurrentKickoffPrivateQuestion(room);
        const isCorrect = checkAnswerMatch(st.submittedAnswer, q.answer, q.accepted);
        this.kpGrade(isCorrect);
      },

      kcAutoGradeSubmitted() {
        if (!this.requireAdmin()) return;
        const room = this.getActiveRoom();
        const st = room.kickoffCommonState;
        const q = this.getCurrentKickoffCommonQuestion(room);
        const winnerId = st.buzzerWinnerId || Object.keys(st.answersByContestant)[0] || room.contestants[0].id;
        st.buzzerWinnerId = winnerId;
        const subText = st.answersByContestant[winnerId]?.text || "";
        const isCorrect = checkAnswerMatch(subText, q.answer, q.accepted);
        this.kcGradeBuzzerWinner(isCorrect);
      },

      finAutoGradeSubmitted() {
        if (!this.requireAdmin()) return;
        const room = this.getActiveRoom();
        const st = room.finishState;
        const q = this.getCurrentFinishQuestion(room);
        if (st.stealWinnerId && st.stealAnswer && !st.stealAnswerGraded) {
          const isRight = checkAnswerMatch(st.stealAnswer, q.answer, q.accepted);
          this.finGradeStealContestant(isRight);
        } else {
          const isRight = checkAnswerMatch(st.primaryAnswer, q.answer, q.accepted);
          this.finGradeMainContestant(isRight);
        }
      },

      kpGrade(isCorrect) {
        if (!this.requireAdmin()) return;
        const room = this.getActiveRoom();
        const st = room.kickoffPrivateState;
        const activeC = room.contestants[st.activeContestantIdx];
        const q = this.getCurrentKickoffPrivateQuestion(room);
        const cfg = room.examSnapshot.roundsConfig.kickoffPrivate;
        const actionKey = `kp_grade_${st.activeContestantIdx}_${st.questionIdxInTurn}`;

        this.stopServerTimer(room, false);
        st.questionStatus = "REVEALED";

        if (st.completedCountByContestant[st.activeContestantIdx] < st.questionIdxInTurn + 1) {
          st.completedCountByContestant[st.activeContestantIdx] = st.questionIdxInTurn + 1;
        }

        if (isCorrect) {
          const pts = q?.points ?? cfg.correctPts ?? 10;
          this.applyScoreChange(room, activeC.id, pts, `Khởi động riêng: Đúng câu ${st.questionIdxInTurn + 1}/6`, actionKey);
          this.triggerStageEffect(room, "answer_correct", `CHÍNH XÁC! +${pts} ĐIỂM CHO ${activeC.name.toUpperCase()}`, `Đáp án chuẩn: ${q.answer}`, activeC.id);
        } else {
          const pts = cfg.wrongPts ?? 0;
          this.applyScoreChange(room, activeC.id, pts, `Khởi động riêng: Sai/Hết giờ câu ${st.questionIdxInTurn + 1}/6`, actionKey);
          this.triggerStageEffect(room, "answer_wrong", `CHƯA CHÍNH XÁC / HẾT GIỜ (0 ĐIỂM)`, `Đáp án chuẩn: ${q.answer}`, activeC.id);
        }
        this.persistMaster(true);
      },

      kpNextQuestion() {
        if (!this.requireAdmin()) return;
        const room = this.getActiveRoom();
        const st = room.kickoffPrivateState;
        if (st.questionStatus !== "REVEALED" && st.questionStatus !== "SCORED") {
          alert("Vui lòng chấm điểm (Đúng / Sai) câu hiện tại trước khi chuyển sang câu tiếp theo!");
          return;
        }
        if (st.questionIdxInTurn < 5) {
          st.questionIdxInTurn += 1;
          st.questionVisible = false;
          st.questionStatus = "HIDDEN";
          st.submittedAnswer = "";
          st.submittedAtMs = null;
          this.stopServerTimer(room, false);
          this.persistMaster(true);
        } else {
          alert(`Thí sinh ${room.contestants[st.activeContestantIdx].name} đã hoàn thành đủ 6/6 câu hỏi! Hãy bấm 'Chuyển Thí Sinh Tiếp Theo'.`);
        }
      },

      kpSwitchContestant(targetIdx, forceOverride = false) {
        if (!this.requireAdmin()) return false;
        const room = this.getActiveRoom();
        const st = room.kickoffPrivateState;
        const currentCompleted = st.completedCountByContestant[st.activeContestantIdx];

        if (currentCompleted < 6 && !forceOverride && targetIdx !== st.activeContestantIdx) {
          const curName = room.contestants[st.activeContestantIdx].name;
          const remaining = 6 - currentCompleted;
          const confirmed = confirm(
            `[CẢNH BÁO QUY TẮC KHỞI ĐỘNG RIÊNG - MỤC 9.5]\n\n` +
            `Thí sinh hiện tại (${curName}) mới hoàn thành ${currentCompleted}/6 câu hỏi (còn lại ${remaining} câu).\n` +
            `Theo luật chuẩn, mỗi thí sinh phải hoàn thành trọn vẹn 6 câu riêng trước khi chuyển sang thí sinh tiếp theo.\n\n` +
            `Bạn có chắc chắn muốn dùng quyền Quản trị viên (Force Override) để chuyển sớm và ghi vào Nhật ký kiểm toán (Audit Log) không?`
          );
          if (!confirmed) return false;
          this.logAudit(this.session.username, "ADMIN", "KP_EARLY_SWITCH_OVERRIDE", `Chuyển sớm từ ${curName} (${currentCompleted}/6 câu) sang thí sinh #${targetIdx + 1}`, room);
        }

        st.activeContestantIdx = targetIdx;
        st.questionIdxInTurn = Math.min(5, st.completedCountByContestant[targetIdx]);
        st.questionVisible = false;
        st.questionStatus = "HIDDEN";
        st.submittedAnswer = "";
        st.submittedAtMs = null;
        this.stopServerTimer(room, false);
        this.persistMaster(true);
        return true;
      },

      getCurrentKickoffCommonQuestion(room) {
        const st = room.kickoffCommonState;
        return room.examSnapshot.kickoffCommon[st.questionIdx] || room.examSnapshot.kickoffCommon[0];
      },

      kcOpenQuestionAndBuzzer() {
        if (!this.requireAdmin()) return;
        const room = this.getActiveRoom();
        const st = room.kickoffCommonState;
        const q = this.getCurrentKickoffCommonQuestion(room);
        st.questionVisible = true;
        st.questionStatus = "ACCEPTING_ANSWERS";
        st.buzzerState = st.mode === "BUZZER" ? "OPEN" : "CLOSED";
        st.buzzerWinnerId = null;
        st.buzzerEvents = [];
        st.answersByContestant = {};
        this.startServerTimer(room, q?.timeSec || 5, `Khởi động chung - Câu ${st.questionIdx + 1}/12`);
        this.persistMaster(true);
      },

      kcPressBuzzer(contestantId) {
        const room = this.getActiveRoom();
        const st = room.kickoffCommonState;
        const c = room.contestants.find(x => x.id === contestantId);
        if (!c) return { ok: false, reason: "INVALID_CONTESTANT" };

        const now = Date.now();
        if (st.buzzerEvents.some(e => e.contestantId === contestantId)) {
          return { ok: false, reason: "DUPLICATE_SIGNAL" };
        }
        if (st.questionStatus !== "ACCEPTING_ANSWERS" || st.buzzerState !== "OPEN") {
          st.buzzerEvents.push({ contestantId, name: c.name, timeMs: now, status: "REJECTED_LOCKED" });
          this.persistMaster(true);
          return { ok: false, reason: "BUZZER_NOT_OPEN" };
        }

        st.buzzerState = "WON";
        st.buzzerWinnerId = contestantId;
        st.buzzerEvents.push({ contestantId, name: c.name, timeMs: now, status: "WON" });
        this.triggerStageEffect(room, "buzzer_win", `${c.name.toUpperCase()} GIÀNH QUYỀN TRẢ LỜI!`, "Tín hiệu chuông hợp lệ đầu tiên tại máy chủ", c.id);
        this.persistMaster(true);
        return { ok: true, winnerId: contestantId };
      },

      kcSubmitAnswer(contestantId, text) {
        const room = this.getActiveRoom();
        const st = room.kickoffCommonState;
        if (st.questionStatus !== "ACCEPTING_ANSWERS") {
          alert("Câu hỏi hiện không mở nhận đáp án!");
          return false;
        }
        if (st.mode === "BUZZER" && st.buzzerWinnerId !== contestantId) {
          alert("Ở chế độ Chuông, bạn phải bấm chuông giành quyền trước khi gửi đáp án!");
          return false;
        }
        st.answersByContestant[contestantId] = {
          text: String(text || "").trim(),
          timeMs: Date.now()
        };
        this.persistMaster(true);
        return true;
      },

      kcGradeBuzzerWinner(isCorrect) {
        if (!this.requireAdmin()) return;
        const room = this.getActiveRoom();
        const st = room.kickoffCommonState;
        const q = this.getCurrentKickoffCommonQuestion(room);
        const winnerId = st.buzzerWinnerId || room.contestants[0].id;
        const winner = room.contestants.find(x => x.id === winnerId);
        const actionKey = `kc_grade_${st.questionIdx}_${winnerId}`;

        this.stopServerTimer(room, false);
        st.questionStatus = "REVEALED";
        st.buzzerState = "LOCKED";

        if (isCorrect) {
          const pts = q?.points ?? 10;
          this.applyScoreChange(room, winner.id, pts, `Khởi động chung: Đúng câu ${st.questionIdx + 1}/12`, actionKey);
          this.triggerStageEffect(room, "answer_correct", `CHÍNH XÁC! +${pts} ĐIỂM CHO ${winner.name.toUpperCase()}`, `Đáp án chuẩn: ${q.answer}`, winner.id);
        } else {
          const pen = q?.wrongPenalty ?? -5;
          this.applyScoreChange(room, winner.id, pen, `Khởi động chung: Trả lời sai câu ${st.questionIdx + 1}/12`, actionKey);
          this.triggerStageEffect(room, "answer_wrong", `CHƯA CHÍNH XÁC (${pen} ĐIỂM) — ${winner.name.toUpperCase()}`, `Đáp án chuẩn: ${q.answer}`, winner.id);
        }
        this.persistMaster(true);
      },

      kcNextQuestion() {
        if (!this.requireAdmin()) return;
        const room = this.getActiveRoom();
        const st = room.kickoffCommonState;
        if (st.questionIdx < room.examSnapshot.kickoffCommon.length - 1) {
          st.questionIdx += 1;
          st.questionVisible = false;
          st.questionStatus = "HIDDEN";
          st.buzzerState = "CLOSED";
          st.buzzerWinnerId = null;
          st.buzzerEvents = [];
          st.answersByContestant = {};
          this.stopServerTimer(room, false);
          this.persistMaster(true);
        } else {
          alert("Đã hoàn thành toàn bộ 12 câu hỏi phần Khởi động chung! Bạn có thể chuyển sang Vòng 2: Vượt chướng ngại vật.");
        }
      },

      obsSelectRow(rowIdx) {
        if (!this.requireAdmin()) return;
        const room = this.getActiveRoom();
        room.obstacleState.selectedRowIdx = rowIdx;
        room.obstacleState.questionVisible = false;
        room.obstacleState.questionStatus = "HIDDEN";
        room.obstacleState.rowAnswersByContestant = {};
        this.stopServerTimer(room, false);
        this.persistMaster(true);
      },

      obsStartRowTimer15s() {
        if (!this.requireAdmin()) return;
        const room = this.getActiveRoom();
        room.obstacleState.questionVisible = true;
        room.obstacleState.questionStatus = "ACCEPTING_ANSWERS";
        room.obstacleState.rowAnswersByContestant = {};
        this.startServerTimer(room, room.examSnapshot.obstacle.timePerRowSec || 15, `Hàng ngang số ${room.obstacleState.selectedRowIdx + 1} (15s)`);
        this.persistMaster(true);
      },

      obsSubmitRowAnswer(contestantId, answerText) {
        const room = this.getActiveRoom();
        const st = room.obstacleState;
        const c = room.contestants.find(x => x.id === contestantId);
        if (!c || c.cnvLocked) {
          alert("Bạn đã bị khóa quyền tham gia vòng Vượt chướng ngại vật do trả lời sai Từ khóa trước đó!");
          return false;
        }
        if (st.questionStatus !== "ACCEPTING_ANSWERS" || room.timer.status !== "RUNNING") {
          alert("Hàng ngang hiện không trong thời gian 15 giây nhận đáp án!");
          return false;
        }
        st.rowAnswersByContestant[contestantId] = String(answerText || "").trim();
